<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Siege Wiki - Rainbow Six Siege Database</title>
  <meta name="description" content="Free fan-made Rainbow Six Siege database: operators, gadgets, maps, seasons and lore - a community companion.">
  <link rel="canonical" href="https://r6-siege-wiki.pages.dev/">
  <meta name="theme-color" content="#090b11">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Siege Wiki">
  <meta property="og:title" content="Siege Wiki - Rainbow Six Siege Database">
  <meta property="og:description" content="Operators, gadgets, maps and seasons for Rainbow Six Siege - a free fan-made companion.">
  <meta property="og:url" content="https://r6-siege-wiki.pages.dev/">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Siege Wiki",
    "url": "https://r6-siege-wiki.pages.dev/",
    "description": "Free fan-made Rainbow Six Siege database: operators, gadgets, maps and seasons.",
    "inLanguage": "en"
  }
  </script>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script src="./vendor/tailwindcss.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: { lg: '7px', xl: '9px', '2xl': '11px', '3xl': '13px' },
          fontFamily: { serif: ['Bitter', 'Georgia', 'serif'] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./engine/engine.css">
</head>

<body>
  <div id="root"></div>
  <script>
    window.__r6MissingDataScripts = [];
    window.__r6DataScriptError = function (name) {
      window.__r6MissingDataScripts.push(name);
      console.error('[data-script-error]', name, 'failed to load');
    };
  </script>
  <script src="data.js" onerror="window.__r6DataScriptError('data.js')"></script>
  <script type="text/babel" src="./engine/icons.js"></script>
  <script type="text/babel" src="./engine/core.js"></script>
  <script type="text/babel" src="./engine/theme.js"></script>
  <script type="text/babel" src="./engine/storage.js"></script>
  <script type="text/babel" src="./engine/device.js"></script>
  <script type="text/babel" src="./engine/shell.js"></script>
  <script type="text/babel" src="./engine/assets.js"></script>
  <script type="text/babel" src="./engine/articles.js"></script>
  <script type="text/babel" src="./games/r6/config.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const DB = (typeof R6_DATABASE !== 'undefined' && R6_DATABASE) || { operators: [], maps: [], seasons: [] };
    const OPERATORS = DB.operators || [];
    const MAPS = DB.maps || [];
    const SEASONS = DB.seasons || [];
    const operatorsById = new Map(OPERATORS.map((op) => [op.id, op]));
    const mapsById = new Map(MAPS.map((m) => [m.id, m]));
    const seasonsById = new Map(SEASONS.map((s) => [s.id, s]));

    const SIDE_COLOR = { Attacker: '#3da5e0', Defender: '#ccac00' };

    const initials = (name) => String(name || '?').split(/[\s'’-]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

    const OpAvatar = ({ name, side, size = 44 }) => (
      <span className="shrink-0 rounded-full flex items-center justify-center font-bold" style={{ width: size, height: size, fontSize: Math.round(size * 0.36), color: '#fff', background: `linear-gradient(135deg, ${SIDE_COLOR[side] || '#666'}55, #10141f)`, border: `2px solid ${SIDE_COLOR[side] || '#666'}` }} aria-hidden="true">{initials(name)}</span>
    );

    const FavButton = ({ active, onToggle, label }) => (
      <button type="button" onClick={onToggle} aria-label={label} title={label} className="shrink-0 rounded-full p-2 transition-all" style={{ border: '1px solid var(--stroke)', color: active ? '#ffd34d' : 'var(--muted)', background: active ? 'rgba(255,211,77,0.12)' : 'transparent' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill={active ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
      </button>
    );

    /* ------------------------------ views --------------------------------- */

    const HomeView = ({ setView, counts }) => {
      const [q, setQ] = useState('');
      const query = q.trim().toLowerCase();
      const opHits = query ? OPERATORS.filter((op) => (op.name + ' ' + op.gadget + ' ' + op.squad + ' ' + op.role).toLowerCase().includes(query)).slice(0, 6) : [];
      const mapHits = query ? MAPS.filter((m) => (m.name + ' ' + m.setting).toLowerCase().includes(query)).slice(0, 4) : [];
      const seasonHits = query ? SEASONS.filter((s) => (s.name + ' ' + s.code).toLowerCase().includes(query)).slice(0, 4) : [];
      const cards = [
        { id: 'operators', title: 'Operators', desc: `${counts.operators} attackers & defenders`, icon: 'User' },
        { id: 'gadgets', title: 'Gadgets', desc: 'Unique abilities & devices', icon: 'Zap' },
        { id: 'maps', title: 'Maps', desc: `${counts.maps} multiplayer maps`, icon: 'Map' },
        { id: 'seasons', title: 'Seasons', desc: `${counts.seasons} seasons of content`, icon: 'Clock' },
      ];
      return (
        <div className="cx-article">
          <h1 className="cx-title">Siege Wiki</h1>
          <p className="cx-lead">The free fan-made Rainbow Six Siege encyclopedia.</p>
          <div className="relative my-4">
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search operators, gadgets, maps, seasons..." aria-label="Search the wiki"
              className="w-full rounded-2xl px-5 py-3.5 text-[15px]" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
          </div>
          {query ? (
            <div>
              {opHits.map((op) => (
                <button key={op.id} type="button" onClick={() => setView('operator', { id: op.id })} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2 text-left" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <OpAvatar name={op.name} side={op.side} size={40} />
                  <span><span className="block font-semibold" style={{ color: 'var(--text)' }}>{op.name}</span>
                    <span className="block text-xs" style={{ color: 'var(--muted)' }}>{op.gadget}</span></span>
                </button>
              ))}
              {mapHits.map((m) => (
                <button key={m.id} type="button" onClick={() => setView('map', { id: m.id })} className="w-full rounded-2xl p-3 mb-2 text-left font-semibold" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }}>{m.name} <span className="text-xs font-normal" style={{ color: 'var(--muted)' }}>· Map</span></button>
              ))}
              {seasonHits.map((s) => (
                <button key={s.id} type="button" onClick={() => setView('season', { id: s.id })} className="w-full rounded-2xl p-3 mb-2 text-left font-semibold" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }}>{s.name} <span className="text-xs font-normal" style={{ color: 'var(--muted)' }}>· {s.code}</span></button>
              ))}
              {opHits.length + mapHits.length + seasonHits.length === 0 ? <p style={{ color: 'var(--muted)' }}>No results for “{q}”.</p> : null}
            </div>
          ) : (
            <div className="grid gap-3 sm:grid-cols-2">
              {cards.map((c) => {
                const Icon = Icons[c.icon] || Icons.Info;
                return (
                  <button key={c.id} type="button" onClick={() => setView(c.id)} className="rounded-2xl p-5 text-left transition-all hover:-translate-y-0.5" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                    <Icon width={26} height={26} style={{ color: 'var(--text)' }} />
                    <span className="block mt-2 text-lg font-bold" style={{ color: 'var(--text)', fontFamily: 'var(--font-display)' }}>{c.title}</span>
                    <span className="block text-sm" style={{ color: 'var(--muted)' }}>{c.desc}</span>
                  </button>
                );
              })}
            </div>
          )}
          <p className="mt-6 text-xs" style={{ color: 'var(--muted)' }}>Operator, map and season data: Rainbow Six Wiki contributors (CC-BY-SA). Fan project, not affiliated with Ubisoft.</p>
        </div>
      );
    };

    const OperatorsView = ({ setView, favorites, onToggleFavorite }) => {
      const [side, setSide] = useState('All');
      const [q, setQ] = useState('');
      const query = q.trim().toLowerCase();
      const list = OPERATORS.filter((op) => (side === 'All' || op.side === side) && (!query || (op.name + ' ' + op.gadget + ' ' + op.squad).toLowerCase().includes(query)));
      return (
        <div className="cx-article">
          <h1 className="cx-title">Operators</h1>
          <p className="cx-lead">{OPERATORS.length} operators · {OPERATORS.filter((o) => o.side === 'Attacker').length} attackers · {OPERATORS.filter((o) => o.side === 'Defender').length} defenders</p>
          <div className="flex gap-2 my-3">
            {['All', 'Attacker', 'Defender'].map((s) => (
              <button key={s} type="button" onClick={() => setSide(s)} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: side === s ? 'var(--text)' : 'transparent', color: side === s ? 'var(--bg-01)' : 'var(--muted)', border: '1px solid var(--stroke)' }}>{s}</button>
            ))}
          </div>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter operators..." aria-label="Filter operators"
            className="w-full rounded-2xl px-4 py-2.5 mb-4 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
          {list.map((op) => (
            <div key={op.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
              <button type="button" onClick={() => setView('operator', { id: op.id })} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                <AssetFrame type="Operator" imageUrl={`./r6_images/operators/icons/${op.id}.png`} fallbackIcon={<OpAvatar name={op.name} side={op.side} />} />
                <span className="min-w-0"><span className="block font-semibold truncate" style={{ color: 'var(--text)' }}>{op.name}</span>
                  <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{op.gadget} · {op.squad}</span></span>
              </button>
              <FavButton active={(favorites.operators || []).includes(op.id)} onToggle={() => onToggleFavorite('Operator', op.id)} label={`Favorite ${op.name}`} />
            </div>
          ))}
          {list.length === 0 ? <p style={{ color: 'var(--muted)' }}>No operators match.</p> : null}
        </div>
      );
    };

    const OperatorArticle = ({ id, setView, favorites, onToggleFavorite }) => {
      const op = operatorsById.get(id);
      if (!op) return <div className="cx-article"><h1 className="cx-title">Not found</h1><p style={{ color: 'var(--muted)' }}>Unknown operator.</p></div>;
      const season = SEASONS.find((s) => s.name === op.season || s.name === `Operation ${op.season}` || op.season === s.name);
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page' }, { label: 'Operators' }, { label: op.name }]}
          title={op.name}
          hatnote={op.quote ? `\u201c${op.quote}\u201d` : null}
          lead={<p>{op.ability}</p>}
          infobox={{
            title: op.name, sub: `${op.side} · ${op.squad}`,
            image: `./r6_images/operators/heroes/${op.id}.png`, imageAlt: op.name, imageType: 'Operator',
            rows: [
              { label: 'Gadget', value: op.gadget },
              { label: 'Role', value: op.role || '—' },
              { label: 'Squad', value: op.squad },
              { label: 'Season', value: op.season },
              { label: 'Armor / Speed', value: `${'●'.repeat(op.armor)}${'○'.repeat(Math.max(0, 3 - op.armor))} / ${'●'.repeat(op.speed)}${'○'.repeat(Math.max(0, 3 - op.speed))}` },
              ...(op.realname ? [{ label: 'Real name', value: op.realname }] : []),
            ],
          }}
        >
          <div className="flex gap-2 mt-2">
            <FavButton active={(favorites.operators || []).includes(op.id)} onToggle={() => onToggleFavorite('Operator', op.id)} label={`Favorite ${op.name}`} />
            {season ? <button type="button" onClick={() => setView('season', { id: season.id })} className="cx-alink text-sm">{season.name} →</button> : null}
          </div>
          <CxSection title="Gadget">
            <p><strong>{op.gadget}.</strong> {op.ability}</p>
          </CxSection>
        </ArticleShell>
      );
    };

    const CxSection = ({ title, children }) => (
      <section className="mt-6">
        <h2 className="cx-h2">{title}</h2>
        <div className="cx-section-body">{children}</div>
      </section>
    );

    const GadgetsView = ({ setView }) => {
      const attackers = OPERATORS.filter((op) => op.side === 'Attacker');
      const defenders = OPERATORS.filter((op) => op.side === 'Defender');
      const Group = ({ title, items, color }) => (
        <div className="mb-6">
          <h2 className="cx-h2" style={{ color }}>{title}</h2>
          <table className="cx-wikitable"><thead><tr><th></th><th>Gadget</th><th>Operator</th></tr></thead>
            <tbody>{items.map((op) => (
              <tr key={op.id}><td><AssetFrame type="Gadget" imageUrl={`./r6_images/gadgets/${op.id}.png`} /></td><td>{op.gadget}</td>
                <td><button type="button" className="cx-alink font-semibold" onClick={() => setView('operator', { id: op.id })}>{op.name}</button></td></tr>
            ))}</tbody></table>
        </div>
      );
      return (
        <div className="cx-article">
          <h1 className="cx-title">Gadgets</h1>
          <p className="cx-lead">Every operator's unique gadget.</p>
          <Group title="Attacker gadgets" items={attackers} color={SIDE_COLOR.Attacker} />
          <Group title="Defender gadgets" items={defenders} color={SIDE_COLOR.Defender} />
        </div>
      );
    };

    const MapsView = ({ setView, favorites, onToggleFavorite }) => (
      <div className="cx-article">
        <h1 className="cx-title">Maps</h1>
        <p className="cx-lead">{MAPS.length} multiplayer maps.</p>
        {MAPS.map((m) => (
          <div key={m.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
            <AssetFrame type="Map" imageUrl={`./r6_images/maps/${m.id}.png`} />
            <button type="button" onClick={() => setView('map', { id: m.id })} className="flex-1 min-w-0 text-left">
              <span className="block font-semibold" style={{ color: 'var(--text)' }}>{m.name}</span>
              <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{m.setting}</span>
            </button>
            <FavButton active={(favorites.maps || []).includes(m.id)} onToggle={() => onToggleFavorite('Map', m.id)} label={`Favorite ${m.name}`} />
          </div>
        ))}
      </div>
    );

    const MapArticle = ({ id, setView }) => {
      const m = mapsById.get(id);
      if (!m) return <div className="cx-article"><h1 className="cx-title">Not found</h1></div>;
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page' }, { label: 'Maps' }, { label: m.name }]}
          title={m.name}
          lead={<p>{m.blurb || m.setting}</p>}
          infobox={{ title: m.name, sub: 'Multiplayer map', image: `./r6_images/maps/${m.id}.png`, imageAlt: m.name, imageType: 'Map', rows: [{ label: 'Setting', value: m.setting || '—' }, { label: 'Terrain', value: m.terrain || '—' }, { label: 'Modes', value: (m.modes || []).join(' · ') }] }}
        />
      );
    };

    const SeasonsView = ({ setView, favorites, onToggleFavorite }) => {
      const byYear = useMemo(() => {
        const groups = {};
        SEASONS.forEach((s) => { (groups[s.year] = groups[s.year] || []).push(s); });
        return Object.keys(groups).map(Number).sort((a, b) => b - a).map((y) => ({ year: y, items: groups[y] }));
      }, []);
      return (
        <div className="cx-article">
          <h1 className="cx-title">Seasons</h1>
          <p className="cx-lead">{SEASONS.length} seasons from Year 1 to Year {Math.max(...SEASONS.map((s) => s.year))}.</p>
          {byYear.map((g) => (
            <div key={g.year} className="mb-6">
              <h2 className="cx-h2">Year {g.year}</h2>
              {g.items.map((s) => (
                <div key={s.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('season', { id: s.id })} className="flex-1 min-w-0 text-left">
                    <span className="block font-semibold" style={{ color: 'var(--text)' }}>{s.name} <span className="text-xs font-normal" style={{ color: 'var(--muted)' }}>{s.code}</span></span>
                    <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{(s.operators || []).join(' · ') || s.released}</span>
                  </button>
                  <FavButton active={(favorites.seasons || []).includes(s.id)} onToggle={() => onToggleFavorite('Season', s.id)} label={`Favorite ${s.name}`} />
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    };

    const SeasonArticle = ({ id, setView }) => {
      const s = seasonsById.get(id);
      if (!s) return <div className="cx-article"><h1 className="cx-title">Not found</h1></div>;
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page' }, { label: 'Seasons' }, { label: s.name }]}
          title={s.name}
          lead={<p>{s.blurb}</p>}
          infobox={{ title: s.code, sub: 'Season', rows: [{ label: 'Released', value: s.released || '—' }, { label: 'Map', value: s.map || '—' }, { label: 'Operators', value: (s.operators || []).join(', ') || '—' }] }}
        >
          {(s.operators || []).length > 0 ? (
            <CxSection title="Operators">
              <div className="flex flex-wrap gap-2">
                {s.operators.map((name) => {
                  const op = OPERATORS.find((o) => o.name === name);
                  return op ? (
                    <button key={name} type="button" onClick={() => setView('operator', { id: op.id })} className="flex items-center gap-2 rounded-full pl-1 pr-3 py-1 text-sm font-semibold" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }}>
                      <OpAvatar name={op.name} side={op.side} size={28} />{op.name}
                    </button>
                  ) : <span key={name} className="text-sm" style={{ color: 'var(--muted)' }}>{name}</span>;
                })}
              </div>
            </CxSection>
          ) : null}
        </ArticleShell>
      );
    };

    const FavoritesView = ({ favorites, setView, onToggleFavorite }) => {
      const favOps = OPERATORS.filter((op) => (favorites.operators || []).includes(op.id));
      const favMaps = MAPS.filter((m) => (favorites.maps || []).includes(m.id));
      const favSeasons = SEASONS.filter((s) => (favorites.seasons || []).includes(s.id));
      const total = favOps.length + favMaps.length + favSeasons.length;
      return (
        <div className="cx-article">
          <h1 className="cx-title">Favorites</h1>
          {total === 0 ? <p style={{ color: 'var(--muted)' }}>Nothing saved yet. Tap the star on any operator, map or season.</p> : (
            <div>
              {favOps.map((op) => (
                <div key={op.id} className="flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('operator', { id: op.id })} className="flex items-center gap-3 flex-1 text-left"><OpAvatar name={op.name} side={op.side} size={36} /><span className="font-semibold" style={{ color: 'var(--text)' }}>{op.name}</span></button>
                  <FavButton active onToggle={() => onToggleFavorite('Operator', op.id)} label={`Unfavorite ${op.name}`} />
                </div>
              ))}
              {favMaps.map((m) => (
                <div key={m.id} className="flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('map', { id: m.id })} className="flex-1 text-left font-semibold" style={{ color: 'var(--text)' }}>{m.name}</button>
                  <FavButton active onToggle={() => onToggleFavorite('Map', m.id)} label={`Unfavorite ${m.name}`} />
                </div>
              ))}
              {favSeasons.map((s) => (
                <div key={s.id} className="flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('season', { id: s.id })} className="flex-1 text-left font-semibold" style={{ color: 'var(--text)' }}>{s.name}</button>
                  <FavButton active onToggle={() => onToggleFavorite('Season', s.id)} label={`Unfavorite ${s.name}`} />
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const SettingsView = ({ settings, setSettings }) => (
      <div className="cx-article">
        <h1 className="cx-title">Settings</h1>
        <h2 className="cx-h2">Appearance</h2>
        <div className="flex gap-2 mb-4">
          {[['oled', 'Black'], ['dark', 'Dark'], ['light', 'Light']].map(([mode, label]) => (
            <button key={mode} type="button" onClick={() => { setSettings((p) => ({ ...p, colorMode: mode })); triggerHaptic('Light'); }} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: settings.colorMode === mode ? 'var(--text)' : 'transparent', color: settings.colorMode === mode ? 'var(--bg-01)' : 'var(--muted)', border: '1px solid var(--stroke)' }}>{label}</button>
          ))}
        </div>
        <h2 className="cx-h2">Text size</h2>
        <div className="flex gap-2 mb-4">
          {[['small', 'Small'], ['default', 'Default'], ['large', 'Large']].map(([size, label]) => (
            <button key={size} type="button" onClick={() => setSettings((p) => ({ ...p, fontSize: size }))} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: settings.fontSize === size ? 'var(--text)' : 'transparent', color: settings.fontSize === size ? 'var(--bg-01)' : 'var(--muted)', border: '1px solid var(--stroke)' }}>{label}</button>
          ))}
        </div>
        <h2 className="cx-h2">About</h2>
        <p className="text-sm" style={{ color: 'var(--muted)' }}>Siege Wiki {META.siteVersion} · data through {META.gameVersion} · synced {META.lastSynced}. Fan project, not affiliated with Ubisoft. Operator, map and season text: Rainbow Six Wiki contributors (CC-BY-SA).</p>
        <button type="button" onClick={() => { try { Object.keys(localStorage).filter((k) => k.startsWith('r6_')).forEach((k) => localStorage.removeItem(k)); } catch (e) { } window.location.reload(); }} className="mt-4 rounded-2xl px-5 py-2.5 text-sm font-semibold" style={{ background: 'rgba(225,29,72,0.15)', border: '1px solid rgba(225,29,72,0.4)', color: '#fda4af' }}>Clear saved data & reload</button>
      </div>
    );

    /* ------------------------------- shell -------------------------------- */

    const DesktopHeader = ({ currentView, setView }) => (
      <header className="website-topbar hidden md:flex items-center gap-6 px-6 h-16 shrink-0" style={{ borderBottom: '1px solid var(--stroke)', background: 'var(--nav-bg)' }}>
        <button type="button" onClick={() => setView('home')} className="flex items-center gap-3">
          <span className="text-lg font-bold tracking-wide" style={{ color: 'var(--text)', fontFamily: 'var(--font-display)' }}>SIEGE <span style={{ color: '#3da5e0' }}>WIKI</span></span>
        </button>
        <nav className="flex items-center gap-1">
          {ALL_NAV_OPTIONS.map((opt) => (
            <button key={opt.id} type="button" onClick={() => setView(opt.id)} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: currentView === opt.id ? 'var(--chip)' : 'transparent', color: currentView === opt.id ? 'var(--text)' : 'var(--muted)' }}>{opt.label}</button>
          ))}
        </nav>
      </header>
    );

    const MobileHeader = ({ title, onOpenDrawer, onOpenSettings }) => (
      <header className="md:hidden flex items-center gap-3 px-4 h-14 shrink-0" style={{ borderBottom: '1px solid var(--stroke)', background: 'var(--nav-bg)' }}>
        <button type="button" onClick={onOpenDrawer} aria-label="Open sections" className="p-2" style={{ color: 'var(--text)' }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <span className="flex-1 truncate text-base font-bold" style={{ color: 'var(--text)', fontFamily: 'var(--font-display)' }}>{title}</span>
        <button type="button" onClick={onOpenSettings} aria-label="Open settings" className="p-2" style={{ color: 'var(--text)' }}><Icons.Gear width={20} height={20} /></button>
      </header>
    );

    const Sidebar = ({ currentView, setView }) => (
      <aside className="website-sidebar hidden md:flex flex-col w-60 shrink-0 px-3 py-4 gap-6 overflow-y-auto" style={{ borderRight: '1px solid var(--stroke)' }}>
        {WEBSITE_NAV_SECTIONS.map((section) => (
          <div key={section.title}>
            <p className="px-3 mb-1 text-[10px] font-bold uppercase tracking-[0.2em]" style={{ color: 'var(--muted)' }}>{section.title}</p>
            {section.items.map((id) => {
              const opt = ALL_NAV_OPTIONS.find((o) => o.id === id);
              if (!opt) return null;
              const Icon = Icons[NAV_ICON_MAP[id]] || Icons.Info;
              const count = id === 'operators' ? OPERATORS.length : id === 'maps' ? MAPS.length : id === 'seasons' ? SEASONS.length : null;
              return (
                <button key={id} type="button" onClick={() => setView(id)} className="w-full flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-semibold" style={{ background: currentView === id ? 'var(--chip)' : 'transparent', color: currentView === id ? 'var(--text)' : 'var(--muted)' }}>
                  <Icon width={17} height={17} />{opt.label}
                  {count !== null ? <span className="ml-auto text-xs" style={{ color: 'var(--muted)' }}>{count}</span> : null}
                </button>
              );
            })}
          </div>
        ))}
      </aside>
    );

    const App = () => {
      const device = useDeviceProfile();
      const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...(loadFromStorage(R6_STORAGE_KEYS.settings, {})) }));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.settings, settings); }, [settings]);
      const [favorites, setFavorites] = useState(() => loadFromStorage(R6_STORAGE_KEYS.favorites, { operators: [], maps: [], seasons: [] }));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.favorites, favorites); }, [favorites]);

      const initialUi = useMemo(() => {
        try {
          const ctx = readLaunchContext();
          const allowed = new Set(['home', ...ARTICLE_VIEWS, ...ALL_NAV_OPTIONS.map((o) => o.id)]);
          return { view: allowed.has(ctx.view) ? ctx.view : 'home', context: ctx.view === 'home' ? {} : { id: (ctx.context && ctx.context.id) || undefined } };
        } catch (e) { return { view: 'home', context: {} }; }
      }, []);
      const [currentView, setCurrentView] = useState(initialUi.view);
      const [viewContext, setViewContext] = useState(initialUi.context);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const mainRef = useRef(null);
      const setView = useCallback((view, context = {}) => {
        setCurrentView(view); setViewContext(context || {});
        setDrawerOpen(false);
        triggerHaptic('Light');
      }, []);

      useEffect(() => {
        const rootEl = document.documentElement;
        const palette = COLOR_MODES[settings.colorMode] || COLOR_MODES.oled;
        rootEl.style.setProperty('--bg-01', palette.bg01);
        rootEl.style.setProperty('--bg-02', palette.bg02);
        rootEl.style.setProperty('--panel', palette.panel);
        rootEl.style.setProperty('--stroke', palette.stroke);
        rootEl.style.setProperty('--chip', palette.chip);
        rootEl.style.setProperty('--text', palette.text);
        rootEl.style.setProperty('--muted', palette.muted);
        rootEl.style.setProperty('--nav-bg', palette.nav);
        rootEl.style.setProperty('--glass-bg', palette.glass);
        rootEl.style.setProperty('--ghost-surface', palette.ghost);
        rootEl.style.setProperty('--ghost-strong', palette.ghostStrong);
        rootEl.style.setProperty('--shadow-soft', palette.shadowSoft);
        rootEl.style.setProperty('--shadow-strong', palette.shadowStrong);
        rootEl.style.setProperty('--site-shell-bg', palette.appShellBg);
        rootEl.style.setProperty('--ambient-glow', palette.ambientGlow);
        rootEl.style.setProperty('--ambient-opacity', palette.ambientOpacity);
        rootEl.style.setProperty('--selection-bg', palette.selectionBg);
        rootEl.style.setProperty('--selection-text', palette.selectionText);
        rootEl.style.setProperty('--accent', palette.accent);
        rootEl.style.setProperty('--accent-soft', palette.accentSoft);
        if (typeof ACCENT_COLOR === 'string' && ACCENT_COLOR) rootEl.style.setProperty('--accent', ACCENT_COLOR);
        if (typeof ACCENT_SOFT === 'string' && ACCENT_SOFT) rootEl.style.setProperty('--accent-soft', ACCENT_SOFT);
        rootEl.style.fontSize = settings.fontSize === 'small' ? '14px' : settings.fontSize === 'large' ? '18px' : '16px';
        document.body.classList.toggle('light-mode', settings.colorMode === 'light');
        document.body.classList.toggle('oled-mode', settings.colorMode === 'oled');
      }, [settings.colorMode, settings.fontSize]);

      useEffect(() => {
        try {
          const suffix = SEO_SUFFIX;
          const viewLabels = SEO_VIEW_LABELS;
          let title = SEO_DEFAULT_TITLE;
          const id = viewContext.id;
          if (id) {
            const pools = [OPERATORS, MAPS];
            let entry = null;
            for (const pool of pools) { entry = (pool || []).find((e) => e && e.id === id) || null; if (entry) break; }
            if (!entry) entry = SEASONS.find((s) => s && s.id === id) || null;
            if (entry && entry.name) title = `${entry.name}${suffix}`;
            else if (viewLabels[currentView]) title = `${viewLabels[currentView]}${suffix}`;
          } else if (viewLabels[currentView]) {
            title = `${viewLabels[currentView]}${suffix}`;
          }
          document.title = title;
          const siteBase = SEO_SITE_BASE;
          let canonical = siteBase + '/';
          if (currentView && currentView !== 'home') {
            canonical = siteBase + '/?view=' + encodeURIComponent(currentView);
            if (id) canonical += '&id=' + encodeURIComponent(id);
          }
          const canonicalLink = document.querySelector('link[rel="canonical"]');
          if (canonicalLink) canonicalLink.setAttribute('href', canonical);
          const ogUrlTag = document.querySelector('meta[property="og:url"]');
          if (ogUrlTag) ogUrlTag.setAttribute('content', canonical);
          const ogTitleTag = document.querySelector('meta[property="og:title"]');
          if (ogTitleTag) ogTitleTag.setAttribute('content', title);
        } catch (e) { }
      }, [currentView, viewContext]);

      const toggleFavorite = useCallback((category, itemId) => {
        const key = FAVORITE_KEYS[category];
        if (!key) return;
        setFavorites((prev) => {
          const favs = prev[key] || [];
          return { ...prev, [key]: favs.includes(itemId) ? favs.filter((v) => v !== itemId) : [...favs, itemId] };
        });
        triggerHaptic('Light');
      }, []);

      const headerTitle = useMemo(() => {
        if (viewContext.id) {
          const entry = operatorsById.get(viewContext.id) || mapsById.get(viewContext.id) || seasonsById.get(viewContext.id);
          if (entry) return entry.name;
        }
        return getNavDisplayLabel(currentView);
      }, [currentView, viewContext]);

      const renderContent = () => {
        const id = viewContext.id;
        switch (currentView) {
          case 'operators': return <OperatorsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'operator': return <OperatorArticle id={id} setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'gadgets': return <GadgetsView setView={setView} />;
          case 'maps': return <MapsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'map': return <MapArticle id={id} setView={setView} />;
          case 'seasons': return <SeasonsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'season': return <SeasonArticle id={id} setView={setView} />;
          case 'favorites': return <FavoritesView favorites={favorites} setView={setView} onToggleFavorite={toggleFavorite} />;
          case 'settings': return <SettingsView settings={settings} setSettings={setSettings} />;
          default: return <HomeView setView={setView} counts={{ operators: OPERATORS.length, maps: MAPS.length, seasons: SEASONS.length }} />;
        }
      };

      return (
        <div data-smoke-ready="true" data-smoke-view={currentView} data-smoke-profile={viewContext.id || ''} className="site-shell website-shell flex flex-col h-screen w-full text-slate-100 overflow-hidden relative">
          {!device.isMobile && <DesktopHeader currentView={currentView} setView={setView} />}
          {device.isMobile && <MobileHeader title={headerTitle} onOpenDrawer={() => setDrawerOpen(true)} onOpenSettings={() => setView('settings')} />}
          <div className="website-workspace relative z-10 flex-1 min-h-0 flex">
            {!device.isMobile && <Sidebar currentView={currentView} setView={setView} />}
            <main ref={mainRef} className="website-main relative flex-1 min-w-0 overflow-y-auto"><div key={currentView + (viewContext.id || '')} className="view-transition min-h-full" style={{ padding: '20px 16px 120px' }}>{renderContent()}</div></main>
          </div>
          {device.isMobile && <SectionDrawer open={drawerOpen} currentView={currentView} onBrowse={(vid) => setView(vid)} onClose={() => setDrawerOpen(false)} />}
          <ScrollToTopFAB mainRef={mainRef} currentView={currentView} />
          {device.isMobile && (
            <div className="fixed bottom-0 left-0 w-full z-[55] px-2 sm:px-6 pb-2 sm:pb-5 flex flex-col items-center gap-2 nav-safe-area">
              <AppToolbar currentView={currentView} drawerOpen={drawerOpen} onSearch={() => setView('home')} onSections={() => { setDrawerOpen(true); triggerHaptic('Light'); }} onSaved={() => setView('favorites')} onSettings={() => setView('settings')} />
            </div>
          )}
        </div>
      );
    };

    if (typeof R6_DATABASE === 'undefined') {
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#e5e7eb;background:#090b11;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif"><h2>Game data failed to load</h2></div>';
    } else {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }
  </script>
</body>

</html>
