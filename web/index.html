<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Siege Wiki - Rainbow Six Siege Database</title>
  <meta name="description" content="Free fan-made Rainbow Six Siege database: operators, gadgets, maps, seasons and lore - a community companion.">
  <link rel="canonical" href="https://r6-siege-wiki.pages.dev/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Siege Wiki">

  <meta name="twitter:description" content="Operators, gadgets, maps and seasons for Rainbow Six Siege - a free fan-made companion.">
  <meta name="twitter:image" content="https://r6-siege-wiki.pages.dev/assets/og-cover.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Siege Wiki",
    "alternateName": "R6 Siege Wiki",
    "url": "https://r6-siege-wiki.pages.dev/",
    "description": "Free fan-made Rainbow Six Siege database: operators, gadgets, maps and seasons.",
    "inLanguage": "en"
  }
  </script>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script src="./vendor/babel.min.js"></script>
  <script src="./vendor/tailwindcss.min.js"></script>
  <script>
    /* Codex palette remap: warm bone-gray zinc/slate scales + Codex red.
       Utilities keep their roles (900 = panel, 500 = dim, 300 = faint text). */
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: {
            lg: '7px', xl: '9px', '2xl': '11px', '3xl': '13px'
          },
          fontFamily: {
            serif: ['Bitter', 'Georgia', 'serif'],
          },
          colors: {
            zinc: {
              50: '#f4f2ee', 100: '#e8e5df', 200: '#d8d4ca', 300: '#b5afa4',
              400: '#8f8a80', 500: '#6e6a63', 600: '#4a4741', 700: '#332f2c',
              800: '#191715', 900: '#0e0d0c', 950: '#050505'
            },
            slate: {
              50: '#f4f2ee', 100: '#e8e5df', 200: '#d8d4ca', 300: '#b5afa4',
              400: '#8f8a80', 500: '#6e6a63', 600: '#4a4741', 700: '#332f2c',
              800: '#191715', 900: '#0e0d0c', 950: '#050505'
            },
            neutral: {
              50: '#f4f2ee', 100: '#e8e5df', 200: '#d8d4ca', 300: '#b5afa4',
              400: '#8f8a80', 500: '#6e6a63', 600: '#4a4741', 700: '#332f2c',
              800: '#191715', 900: '#0e0d0c', 950: '#050505'
            },
            red: {
              50: '#fff1f0', 100: '#ffdfdd', 200: '#ffc4c1', 300: '#ff9a95',
              400: '#ff6b63', 500: '#ff3b30', 600: '#e02d23', 700: '#b81f17',
              800: '#7a130e', 900: '#4a0e0a', 950: '#2a0806'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./engine/engine.css">
</head>

<body>
  <div id="launch-overlay" class="launch-overlay" aria-live="polite">
    <div class="launch-stage">
      <img class="launch-logo" src="./assets/loading/r6-logo-static.png" alt="Siege Wiki logo">
      <p class="launch-status">Loading</p>
      <div class="launch-progress-wrap" aria-hidden="true">
        <div class="launch-progress">
          <div class="launch-progress-track"></div>
          <div class="launch-progress-fill"></div>
        </div>
      </div>
      <div class="launch-tip">
        <span class="launch-tip-label">Tip</span>
        <p id="launch-overlay-tip" class="launch-tip-text">Drone first, peek second.</p>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script>
    window.__r6MissingDataScripts = [];
    window.__r6DataScriptError = function (name) {
      window.__r6MissingDataScripts.push(name);
      console.error('[data-script-error]', name, 'failed to load');
    };
  </script>
  <script src="data.js" onerror="window.__r6DataScriptError('data.js')"></script>
  <script>
    (() => {
      const LAUNCH_TIPS = [
        'Drone first, peek second.',
        'Vertical play wins rounds. Open the floor above the site.',
        'A default plant beats a hero play.',
        'Mute jammers stop more than drones.',
        'Reinforce the right walls, not every wall.',
        'Sound is intel. Stop sprinting when it matters.',
        'One ping can save a round. Ping the defuser.',
        'Check your corners, then check them again.',
        'Utility wins executes. Save a smoke for the plant.',
        'Nerf Jackal.',
        'Do not peek everything at once.',
        'The defuser wins games. Protect the carrier.',
      ];
      const overlay = document.getElementById('launch-overlay');
      const tipEl = document.getElementById('launch-overlay-tip');
      const startedAt = Date.now();
      const LAUNCH_OVERLAY_MIN_MS = 400;
      if (tipEl) {
        tipEl.textContent = LAUNCH_TIPS[Math.floor(Math.random() * LAUNCH_TIPS.length)];
      }
      window.__hideLaunchOverlay = (immediate = false) => {
        if (!overlay || overlay.dataset.hidden === 'true') return;
        const hide = () => {
          if (overlay.dataset.hidden === 'true') return;
          overlay.dataset.hidden = 'true';
          overlay.classList.add('launch-overlay--hidden');
          window.setTimeout(() => overlay.remove(), 640);
        };
        const minDuration = immediate ? 0 : LAUNCH_OVERLAY_MIN_MS;
        const remaining = Math.max(0, startedAt + minDuration - Date.now());
        window.setTimeout(hide, remaining);
      };
    })();
  </script>
  <script type="text/babel" src="./engine/icons.js"></script>
  <script type="text/babel" src="./engine/core.js"></script>
  <script type="text/babel" src="./engine/theme.js"></script>
  <script type="text/babel" src="./engine/storage.js"></script>
  <script type="text/babel" src="./engine/device.js"></script>
  <script type="text/babel" src="./engine/shell.js"></script>
  <script type="text/babel" src="./engine/assets.js"></script>
  <script type="text/babel" src="./engine/articles.js"></script>
  <script type="text/babel" src="./games/r6/config.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const DB = (typeof R6_DATABASE !== 'undefined' && R6_DATABASE) || { operators: [], maps: [], seasons: [] };
    const OPERATORS = DB.operators || [];
    const MAPS = DB.maps || [];
    const SEASONS = DB.seasons || [];
    const operatorsById = new Map(OPERATORS.map((op) => [op.id, op]));
    const mapsById = new Map(MAPS.map((m) => [m.id, m]));
    const seasonsById = new Map(SEASONS.map((s) => [s.id, s]));

    const SIDE_COLOR = { Attacker: '#3da5e0', Defender: '#ccac00' };

    const initials = (name) => String(name || '?').split(/[\s'’-]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

    const OpAvatar = ({ name, side, size = 44 }) => (
      <span className="shrink-0 rounded-full flex items-center justify-center font-bold" style={{ width: size, height: size, fontSize: Math.round(size * 0.36), color: '#fff', background: `linear-gradient(135deg, ${SIDE_COLOR[side] || '#666'}55, #10141f)`, border: `2px solid ${SIDE_COLOR[side] || '#666'}` }} aria-hidden="true">{initials(name)}</span>
    );

    const FavButton = ({ active, onToggle, label }) => (
      <button type="button" onClick={onToggle} aria-label={label} title={label} className="shrink-0 rounded-full p-2 transition-all" style={{ border: '1px solid var(--stroke)', color: active ? '#ffd34d' : 'var(--muted)', background: active ? 'rgba(255,211,77,0.12)' : 'transparent' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill={active ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
      </button>
    );

    /* ------------------------------ views --------------------------------- */

    const HomeView = ({ setView, counts }) => {
      const [searchTerm, setSearchTerm] = useState('');
      const deferredQuery = React.useDeferredValue ? React.useDeferredValue(searchTerm) : searchTerm;
      const parseQuery = (raw) => {
        const text = raw.trim();
        const m = text.match(/^(op|map|season|gadget|random):\s*(.*)$/i);
        if (m) return { prefix: m[1].toLowerCase(), text: m[2].trim().toLowerCase() };
        return { prefix: '', text: text.toLowerCase() };
      };
      const { prefix, text: query } = parseQuery(deferredQuery);
      const inScope = (scope) => !prefix || prefix === scope;
      const opHits = query && inScope('op') ? OPERATORS.filter((op) => (op.name + ' ' + op.gadget + ' ' + op.squad + ' ' + op.role).toLowerCase().includes(query)).slice(0, 8) : [];
      const gadgetHits = query && (inScope('gadget') || !prefix) ? OPERATORS.filter((op) => (op.gadget + ' ' + op.name).toLowerCase().includes(query)).slice(0, 6) : [];
      const mapHits = query && inScope('map') ? MAPS.filter((m) => (m.name + ' ' + m.setting).toLowerCase().includes(query)).slice(0, 4) : [];
      const seasonHits = query && inScope('season') ? SEASONS.filter((s) => (s.name + ' ' + s.code).toLowerCase().includes(query)).slice(0, 4) : [];
      const randomOp = prefix === 'random' ? OPERATORS[Math.floor(Math.random() * OPERATORS.length)] : null;
      const browseLinks = [
        { id: 'operators', label: 'Operators', count: counts.operators },
        { id: 'gadgets', label: 'Gadgets', count: counts.operators },
        { id: 'maps', label: 'Maps', count: counts.maps },
        { id: 'seasons', label: 'Seasons', count: counts.seasons },
      ];
      const tools = [
        { id: 'operators', tool: 'Operators', purpose: 'Browse all operators' },
        { id: 'gadgets', tool: 'Gadgets', purpose: 'Browse all gadgets' },
        { id: 'maps', tool: 'Maps', purpose: 'Browse all maps' },
        { id: 'seasons', tool: 'Seasons', purpose: 'Browse all seasons' },
        { id: 'favorites', tool: 'Favorites', purpose: 'Your saved operators, maps and seasons' },
        { id: 'settings', tool: 'Settings', purpose: 'Appearance and saved data' },
      ];
      const latestSeasons = [...SEASONS].sort((a, b) => b.year - a.year || b.code.localeCompare(a.code)).slice(0, 2);
      const ResultRow = ({ title, sub, onOpen }) => (
        <div className="p-3 rounded-2xl border flex items-center gap-3 mb-2" style={{ background: 'var(--panel)', borderColor: 'var(--stroke)' }}>
          <span className="min-w-0 flex-1"><span className="block font-semibold truncate" style={{ color: 'var(--text)' }}>{title}</span>
            <span className="block text-xs truncate uppercase" style={{ color: 'var(--muted)' }}>{sub}</span></span>
          <button type="button" onClick={onOpen} className="cx-toolbtn shrink-0">Open</button>
        </div>
      );
      return (
        <div className="cx-article">
          <div className="max-w-3xl mx-auto">
            <div className="flex items-center border rounded-lg p-2" style={{ background: 'rgba(255,255,255,0.05)' }}>
              <Icons.Search width={18} height={18} style={{ color: 'var(--muted)' }} />
              <input id="home-search-input" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder="Search operators, gadgets, maps, seasons... (op:, map:, season:, gadget:, random:)" aria-label="Search the wiki"
                className="flex-1 bg-transparent px-3 py-1.5 text-[15px] outline-none" style={{ color: 'var(--text)' }} />
              {searchTerm ? <button type="button" onClick={() => setSearchTerm('')} aria-label="Clear search" style={{ color: 'var(--muted)' }}><Icons.X width={16} height={16} /></button> : null}
            </div>
          </div>
          <div className="home-command mt-2 pb-24">
            {prefix === 'random' && randomOp ? (
              <div className="max-w-3xl mx-auto">
                <div className="p-4 rounded-2xl border flex items-center gap-4" style={{ background: 'var(--panel)', borderColor: 'var(--stroke)' }}>
                  <AssetFrame type="Operator" imageUrl={randomOp.icon ? `./${randomOp.icon}` : null} fallbackIcon={<OpAvatar name={randomOp.name} side={randomOp.side} />} />
                  <span><span className="block text-lg font-bold" style={{ color: 'var(--text)', fontFamily: 'var(--font-display)' }}>{randomOp.name}</span>
                    <span className="block text-sm" style={{ color: 'var(--muted)' }}>{randomOp.gadget}</span></span>
                  <span className="flex-1" />
                  <button type="button" onClick={() => setView('operator', { id: randomOp.id })} className="cx-toolbtn">Open</button>
                  <button type="button" onClick={() => setSearchTerm('random: ')} className="cx-toolbtn cx-toolbtn--quiet">Re-roll</button>
                </div>
              </div>
            ) : query ? (
              <div className="max-w-3xl mx-auto">
                <p className="text-sm mb-2" style={{ color: 'var(--muted)' }}>{opHits.length + gadgetHits.length + mapHits.length + seasonHits.length} Matches</p>
                {opHits.map((op) => <ResultRow key={op.id} title={op.name} sub={`Operator · ${op.gadget}`} onOpen={() => setView('operator', { id: op.id })} />)}
                {gadgetHits.filter((g) => !opHits.includes(g)).map((op) => <ResultRow key={'g' + op.id} title={op.gadget} sub={`Gadget · ${op.name}`} onOpen={() => setView('operator', { id: op.id })} />)}
                {mapHits.map((m) => <ResultRow key={m.id} title={m.name} sub="Map" onOpen={() => setView('map', { id: m.id })} />)}
                {seasonHits.map((s) => <ResultRow key={s.id} title={s.name} sub={`Season · ${s.code}`} onOpen={() => setView('season', { id: s.id })} />)}
                {opHits.length + gadgetHits.length + mapHits.length + seasonHits.length === 0 ? <p>No results found.</p> : null}
              </div>
            ) : (
              <div>
                <div className="mp-welcome">
                  <p className="mp-welcome-title">Welcome to <span className="mp-welcome-name">Siege Wiki,</span></p>
                  <p className="mp-welcome-sub">The free Rainbow Six Siege encyclopedia.</p>
                </div>
                <section id="browse">
                  <h2 className="cx-sec">Browse by category</h2>
                  <div className="cx-linkcols">
                    {browseLinks.map((l) => (
                      <div key={l.id}><button type="button" className="cx-alink" onClick={() => setView(l.id)}>{l.label}</button> <span className="cx-cnt">{l.count}</span></div>
                    ))}
                  </div>
                </section>
                <section id="tools">
                  <h2 className="cx-sec">Tools</h2>
                  <table className="cx-wikitable"><thead><tr><th>Tool</th><th>Purpose</th></tr></thead>
                    <tbody>{tools.map((row) => (
                      <tr key={row.id} onClick={() => setView(row.id)} style={{ cursor: 'pointer' }}><td><span className="cx-alink">{row.tool}</span></td><td>{row.purpose}</td></tr>
                    ))}</tbody></table>
                </section>
                <section id="news">
                  <h2 className="cx-sec">Patch notes</h2>
                  <table className="cx-wikitable"><caption>Latest releases from the timeline</caption><thead><tr><th>Release</th><th>Date</th><th>Summary</th></tr></thead>
                    <tbody>{latestSeasons.map((s) => (
                      <tr key={s.id}><td><button type="button" className="cx-alink" onClick={() => setView('season', { id: s.id })}>{s.name}</button></td><td>{s.released || s.code}</td><td>{(s.blurb || '').slice(0, 120)}</td></tr>
                    ))}</tbody></table>
                </section>
                <nav className="cx-cats">Categories: {browseLinks.map((l, i) => (
                  <span key={l.id}>{i > 0 ? <span className="cx-sep"> · </span> : null}<button type="button" className="cx-alink" onClick={() => setView(l.id)}>{l.label}</button></span>
                ))}</nav>
              </div>
            )}
          </div>
          <p className="mt-6 text-xs" style={{ color: 'var(--muted)' }}>Operator, map and season data: Rainbow Six Wiki contributors (CC-BY-SA). Fan project, not affiliated with Ubisoft.</p>
        </div>
      );
    };
    const OperatorsView = ({ setView, favorites, onToggleFavorite }) => {
      const [side, setSide] = useState('All');
      const [q, setQ] = useState('');
      const query = q.trim().toLowerCase();
      const [sort, setSort] = useState('name-az');
      const list = OPERATORS.filter((op) => (side === 'All' || op.side === side) && (!query || (op.name + ' ' + op.gadget + ' ' + op.squad).toLowerCase().includes(query)))
        .sort((a, b) => sort === 'name-za' ? b.name.localeCompare(a.name) : sort === 'side' ? (a.side.localeCompare(b.side) || a.name.localeCompare(b.name)) : a.name.localeCompare(b.name));
      return (
        <div className="cx-article">
          <h1 className="cx-title">Operators</h1>
          <p className="cx-lead">{OPERATORS.length} operators · {OPERATORS.filter((o) => o.side === 'Attacker').length} attackers · {OPERATORS.filter((o) => o.side === 'Defender').length} defenders</p>
          <div className="flex gap-2 my-3">
            {['All', 'Attacker', 'Defender'].map((s) => (
              <button key={s} type="button" onClick={() => setSide(s)} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: side === s ? 'var(--text)' : 'transparent', color: side === s ? 'var(--bg-01)' : 'var(--muted)', border: '1px solid var(--stroke)' }}>{s}</button>
            ))}
          </div>
          <WikiHeaderSearchPortal>
            <div className="flex gap-2">
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter operators..." aria-label="Filter operators"
                className="flex-1 rounded-2xl px-4 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
              <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort operators" className="rounded-2xl px-3 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }}>
                <option value="name-az">A–Z</option>
                <option value="name-za">Z–A</option>
                <option value="side">Side</option>
              </select>
            </div>
          </WikiHeaderSearchPortal>
          <p className="text-sm my-2" style={{ color: 'var(--muted)' }}>{list.length} operators</p>
          {list.map((op) => (
            <div key={op.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
              <button type="button" onClick={() => setView('operator', { id: op.id })} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                <AssetFrame type="Operator" imageUrl={`./r6_images/operators/icons/${op.id}.png`} fallbackIcon={<OpAvatar name={op.name} side={op.side} />} />
                <span className="min-w-0"><span className="block font-semibold truncate" style={{ color: 'var(--text)' }}>{op.name}</span>
                  <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{op.gadget} · {op.squad}</span></span>
              </button>
              <FavButton active={(favorites.operators || []).includes(op.id)} onToggle={() => onToggleFavorite('Operator', op.id)} label={`Favorite ${op.name}`} />
            </div>
          ))}
          {list.length === 0 ? <p style={{ color: 'var(--muted)' }}>No operators match.</p> : null}
        </div>
      );
    };

    const OperatorArticle = ({ id, setView, favorites, onToggleFavorite, note, onNoteChange }) => {
      const op = operatorsById.get(id);
      if (!op) return <div className="cx-article"><h1 className="cx-title">Not found</h1><p style={{ color: 'var(--muted)' }}>Unknown operator.</p></div>;
      const season = SEASONS.find((s) => s.name === op.season || s.name === `Operation ${op.season}` || op.season === s.name);
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page' }, { label: 'Operators' }, { label: op.name }]}
          title={op.name}
          hatnote={op.quote ? `\u201c${op.quote}\u201d` : null}
          lead={<p>{op.ability}</p>}
          toc={[{ id: 'gadget', label: 'Gadget' }, { id: 'loadout', label: 'Loadout' }]}
          categories={[op.side + 's', op.squad]}
          infobox={{
            title: op.name, sub: `${op.side} · ${op.squad}`,
            image: op.hero ? `./${op.hero}` : null, imageAlt: op.name, imageType: 'Hero',
            rows: [
              { label: 'Gadget', value: op.gadget },
              { label: 'Role', value: op.role || '—' },
              { label: 'Squad', value: op.squad },
              { label: 'Season', value: op.season },
              { label: 'Armor / Speed', value: `${'●'.repeat(op.armor)}${'○'.repeat(Math.max(0, 3 - op.armor))} / ${'●'.repeat(op.speed)}${'○'.repeat(Math.max(0, 3 - op.speed))}` },
              ...(op.realname ? [{ label: 'Real name', value: op.realname }] : []),
            ],
          }}
        >
          <div className="flex gap-2 mt-2">
            <FavButton active={(favorites.operators || []).includes(op.id)} onToggle={() => onToggleFavorite('Operator', op.id)} label={`Favorite ${op.name}`} />
            {season ? <button type="button" onClick={() => setView('season', { id: season.id })} className="cx-alink text-sm">{season.name} →</button> : null}
          </div>
          <CxSection id="gadget" title="Gadget">
            <div className="flex items-center gap-3">
              <AssetFrame type="Gadget" imageUrl={op.gadgetIcon ? `./${op.gadgetIcon}` : null} />
              <p><strong>{op.gadget}.</strong> {op.ability}</p>
            </div>
          </CxSection>
          {(op.weapons || []).length > 0 ? (
            <CxSection id="loadout" title="Loadout">
              {[['primary', 'Primaries'], ['secondary', 'Secondaries'], ['gadget', 'Gadgets']].map(([slot, label]) => {
                const items = (op.weapons || []).filter((w) => w.slot === slot);
                if (!items.length) return null;
                return (
                  <div key={slot} className="mb-4">
                    <h3 className="cx-sub">{label}</h3>
                    {items.map((w, i) => (
                      <div key={`${w.name}-${i}`} className="flex items-center gap-3 rounded-2xl p-2.5 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                        {slot === 'gadget' ? null : <AssetFrame type="Weapon" imageUrl={w.image ? `./${w.image}` : null} />}
                        <span className="font-semibold text-sm" style={{ color: 'var(--text)' }}>{w.name}</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </CxSection>
          ) : null}
          <NotesEditor title="Operator Notes" value={note || ''} onChange={onNoteChange} placeholder="Strats, counters, setups..." />
        </ArticleShell>
      );
    };

    const CxSection = ({ id, title, children }) => (
      <section id={id} className="mt-6">

              className="w-full rounded-2xl px-4 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
          </WikiHeaderSearchPortal>

          <Group title="Defender gadgets" items={defenders} color={SIDE_COLOR.Defender} />

    const MapsView = ({ setView, favorites, onToggleFavorite }) => {
      const [q, setQ] = useState('');
      const [sort, setSort] = useState('name-az');
      const query = q.trim().toLowerCase();
      const list = MAPS.filter((m) => !query || (m.name + ' ' + (m.setting || '')).toLowerCase().includes(query))
        .sort((a, b) => sort === 'name-za' ? b.name.localeCompare(a.name) : a.name.localeCompare(b.name));
      return (
      <div className="cx-article">
        <h1 className="cx-title">Maps</h1>
        <p className="cx-lead">{MAPS.length} multiplayer maps.</p>
        <WikiHeaderSearchPortal>
          <div className="flex gap-2">
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter maps..." aria-label="Filter maps"
              className="flex-1 rounded-2xl px-4 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
            <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort maps" className="rounded-2xl px-3 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }}>
              <option value="name-az">A–Z</option>
              <option value="name-za">Z–A</option>
            </select>
          </div>
        </WikiHeaderSearchPortal>
        <p className="text-sm my-2" style={{ color: 'var(--muted)' }}>{list.length} maps</p>
        {list.map((m) => (
          <div key={m.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
            <AssetFrame type="Map" imageUrl={m.thumb ? `./${m.thumb}` : null} />
            <button type="button" onClick={() => setView('map', { id: m.id })} className="flex-1 min-w-0 text-left">
              <span className="block font-semibold" style={{ color: 'var(--text)' }}>{m.name}</span>
              <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{m.setting}</span>
            </button>
            <FavButton active={(favorites.maps || []).includes(m.id)} onToggle={() => onToggleFavorite('Map', m.id)} label={`Favorite ${m.name}`} />

    const MapArticle = ({ id, setView, note, onNoteChange }) => {
      const m = mapsById.get(id);
      if (!m) return <div className="cx-article"><h1 className="cx-title">Not found</h1></div>;
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page' }, { label: 'Maps' }, { label: m.name }]}
          title={m.name}
          lead={<p>{m.blurb || m.setting}</p>}
          categories={['Maps']}
          infobox={{ title: m.name, sub: 'Multiplayer map', image: m.thumb ? `./${m.thumb}` : null, imageAlt: m.name, imageType: 'Map', rows: [{ label: 'Setting', value: m.setting || '—' }, { label: 'Terrain', value: m.terrain || '—' }, { label: 'Modes', value: (m.modes || []).join(' · ') }] }}
        >
          <NotesEditor title="Map Notes" value={note || ''} onChange={onNoteChange} placeholder="Setups, callouts, defaults..." />
        </ArticleShell>
      );

    const SeasonsView = ({ setView, favorites, onToggleFavorite }) => {
      const [q, setQ] = useState('');
      const query = q.trim().toLowerCase();
      const filtered = SEASONS.filter((s) => !query || (s.name + ' ' + s.code + ' ' + (s.operators || []).join(' ')).toLowerCase().includes(query));
      const byYear = (() => {
        const groups = {};
        filtered.forEach((s) => { (groups[s.year] = groups[s.year] || []).push(s); });
        return Object.keys(groups).map(Number).sort((a, b) => b - a).map((y) => ({ year: y, items: groups[y] }));
      })();
      return (
        <div className="cx-article">
          <h1 className="cx-title">Seasons</h1>
          <p className="cx-lead">{SEASONS.length} seasons from Year 1 to Year {Math.max(...SEASONS.map((s) => s.year))}.</p>
          <WikiHeaderSearchPortal>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter seasons..." aria-label="Filter seasons"
              className="w-full rounded-2xl px-4 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
          </WikiHeaderSearchPortal>
          {byYear.map((g) => (
            <div key={g.year} className="mb-6">
              <h2 className="cx-h2">Year {g.year}</h2>
              {g.items.map((s) => (
                <div key={s.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('season', { id: s.id })} className="flex-1 min-w-0 text-left">
                    <span className="block font-semibold" style={{ color: 'var(--text)' }}>{s.name} <span className="text-xs font-normal" style={{ color: 'var(--muted)' }}>{s.code}</span></span>
                    <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{(s.operators || []).join(' · ') || s.released}</span>
                  </button>
                  <FavButton active={(favorites.seasons || []).includes(s.id)} onToggle={() => onToggleFavorite('Season', s.id)} label={`Favorite ${s.name}`} />
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    };

    const SeasonArticle = ({ id, setView, note, onNoteChange }) => {
      const s = seasonsById.get(id);
      if (!s) return <div className="cx-article"><h1 className="cx-title">Not found</h1></div>;
      const seasonMap = MAPS.find((m) => m.name === s.map);
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page' }, { label: 'Seasons' }, { label: s.name }]}
          title={s.name}
          lead={<p>{s.blurb}</p>}
          toc={(s.operators || []).length > 0 ? [{ id: 'operators', label: 'Operators' }] : null}
          categories={['Seasons', s.code]}
          infobox={{ title: s.code, sub: 'Season', image: seasonMap && seasonMap.thumb ? `./${seasonMap.thumb}` : null, imageAlt: s.map, imageType: 'Map', rows: [{ label: 'Released', value: s.released || '—' }, { label: 'Map', value: s.map || '—' }, { label: 'Operators', value: (s.operators || []).join(', ') || '—' }] }}
        >
          {(s.operators || []).length > 0 ? (
            <CxSection id="operators" title="Operators">
              <div className="flex flex-wrap gap-2">
                {s.operators.map((name) => {
                  const op = OPERATORS.find((o) => o.name === name);

                    <button key={name} type="button" onClick={() => setView('operator', { id: op.id })} className="flex items-center gap-2 rounded-full pl-1 pr-3 py-1 text-sm font-semibold" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }}>
                      <OpAvatar name={op.name} side={op.side} size={28} />{op.name}

                })}
              </div>
            </CxSection>
          ) : null}
          <NotesEditor title="Season Notes" value={note || ''} onChange={onNoteChange} placeholder="Meta reads, bans, strats..." />
        </ArticleShell>
      );

    const FavoritesView = ({ favorites, setView, onToggleFavorite }) => {
      const favOps = OPERATORS.filter((op) => (favorites.operators || []).includes(op.id));
      const favMaps = MAPS.filter((m) => (favorites.maps || []).includes(m.id));
      const favSeasons = SEASONS.filter((s) => (favorites.seasons || []).includes(s.id));
      const total = favOps.length + favMaps.length + favSeasons.length;
      return (
        <div className="cx-article">
          <h1 className="cx-title">Favorites</h1>
          {total === 0 ? <p style={{ color: 'var(--muted)' }}>Nothing saved yet. Tap the star on any operator, map or season.</p> : (
            <div>
              {favOps.map((op) => (
                <div key={op.id} className="flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('operator', { id: op.id })} className="flex items-center gap-3 flex-1 text-left"><OpAvatar name={op.name} side={op.side} size={36} /><span className="font-semibold" style={{ color: 'var(--text)' }}>{op.name}</span></button>
                  <FavButton active onToggle={() => onToggleFavorite('Operator', op.id)} label={`Unfavorite ${op.name}`} />
                </div>
              ))}
              {favMaps.map((m) => (
                <div key={m.id} className="flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('map', { id: m.id })} className="flex-1 text-left font-semibold" style={{ color: 'var(--text)' }}>{m.name}</button>
                  <FavButton active onToggle={() => onToggleFavorite('Map', m.id)} label={`Unfavorite ${m.name}`} />
                </div>
              ))}
              {favSeasons.map((s) => (
                <div key={s.id} className="flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('season', { id: s.id })} className="flex-1 text-left font-semibold" style={{ color: 'var(--text)' }}>{s.name}</button>
                  <FavButton active onToggle={() => onToggleFavorite('Season', s.id)} label={`Unfavorite ${s.name}`} />
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const SettingsView = ({ settings, setSettings }) => (
      <div className="cx-article">
        <h1 className="cx-title">Settings</h1>
        <h2 className="cx-h2">Appearance</h2>
        <div className="flex gap-2 mb-4">
          {[['oled', 'Black'], ['dark', 'Dark'], ['light', 'Light']].map(([mode, label]) => (
            <button key={mode} type="button" onClick={() => { setSettings((p) => ({ ...p, colorMode: mode })); triggerHaptic('Light'); }} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: settings.colorMode === mode ? 'var(--text)' : 'transparent', color: settings.colorMode === mode ? 'var(--bg-01)' : 'var(--muted)', border: '1px solid var(--stroke)' }}>{label}</button>
          ))}
        </div>
        <h2 className="cx-h2">Text size</h2>
        <div className="flex gap-2 mb-4">
          {[['small', 'Small'], ['default', 'Default'], ['large', 'Large']].map(([size, label]) => (
            <button key={size} type="button" onClick={() => setSettings((p) => ({ ...p, fontSize: size }))} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: settings.fontSize === size ? 'var(--text)' : 'transparent', color: settings.fontSize === size ? 'var(--bg-01)' : 'var(--muted)', border: '1px solid var(--stroke)' }}>{label}</button>
          ))}
        </div>
        <h2 className="cx-h2">Backup</h2>
        <p className="text-sm mb-2" style={{ color: 'var(--muted)' }}>Export settings, favorites and notes as JSON, or restore from a backup file.</p>
        <div className="flex flex-wrap gap-2 mb-4">
          <button type="button" onClick={() => {
            try {
              const payload = { app: 'siege-wiki', version: 1, exportedAt: new Date().toISOString(), settings, favorites: loadFromStorage(R6_STORAGE_KEYS.favorites, {}), notes: loadFromStorage(R6_STORAGE_KEYS.notes, {}) };
              const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = 'siege-wiki-backup.json';
              a.click();
              setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            } catch (e) { }
          }} className="cx-toolbtn">Download backup</button>
          <label className="cx-toolbtn cx-toolbtn--quiet" style={{ cursor: 'pointer' }}>Restore backup
            <input type="file" accept="application/json" hidden onChange={(e) => {
              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => {
                try {
                  const payload = JSON.parse(reader.result);
                  if (payload.app !== 'siege-wiki') throw new Error('bad backup');
                  if (payload.settings) setSettings((p) => ({ ...p, ...payload.settings }));
                  if (payload.favorites) saveToStorage(R6_STORAGE_KEYS.favorites, payload.favorites);
                  if (payload.notes) saveToStorage(R6_STORAGE_KEYS.notes, payload.notes);
                  window.location.reload();
                } catch (err) { }
              };
              reader.readAsText(file);
              e.target.value = '';
            }} />
          </label>
        </div>
        <h2 className="cx-h2">About</h2>
        <p className="text-sm" style={{ color: 'var(--muted)' }}>Siege Wiki {META.siteVersion} · data through {META.gameVersion} · synced {META.lastSynced}. Fan project, not affiliated with Ubisoft. Operator, map and season text: Rainbow Six Wiki contributors (CC-BY-SA).</p>
        <button type="button" onClick={() => { try { Object.keys(localStorage).filter((k) => k.startsWith('r6_')).forEach((k) => localStorage.removeItem(k)); } catch (e) { } window.location.reload(); }} className="mt-4 rounded-2xl px-5 py-2.5 text-sm font-semibold" style={{ background: 'rgba(225,29,72,0.15)', border: '1px solid rgba(225,29,72,0.4)', color: '#fda4af' }}>Clear saved data & reload</button>
      </div>
    );

    /* ------------------------------- shell -------------------------------- */

    const WikiHeader = ({ currentView, setView }) => {
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== '/') return;
          const tgt = e.target;
          if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable)) return;
          const slot = document.getElementById('wiki-header-search-slot');
          const input = slot && slot.querySelector('input');
          if (input) {
            e.preventDefault();
            input.focus();
            input.select();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      const hasSearch = !['home'].includes(currentView);
      return (
        <header className="wiki-header sticky top-0 z-30 flex items-center justify-between gap-4 px-4">
          <button type="button" onClick={() => setView('home')} className="flex items-center gap-3 shrink-0" aria-label="Main page">
            <img src="./assets/wiki-logo.png" alt="" width={100} height={42} className="wiki-logo-img" style={{ objectFit: 'contain' }} />
            <span className="flex flex-col leading-none text-left">
              <span className="text-[15px] font-bold text-[var(--text)]" style={{ fontFamily: 'var(--font-display)', fontWeight: 700 }}>Siege Wiki</span>
              <span className="text-[8.5px] uppercase tracking-[0.18em] mt-1" style={{ color: 'var(--text-faint)' }}>Rainbow Six Siege</span>
            </span>
          </button>
          <div
            id="wiki-header-search-slot"
            className="absolute flex items-center"
            style={{
              left: '50%',
              transform: 'translateX(-50%)',
              width: hasSearch ? '470px' : '0px',
              opacity: hasSearch ? 1 : 0,
              pointerEvents: hasSearch ? 'auto' : 'none',
              overflow: hasSearch ? 'visible' : 'hidden'
            }}
          />
          <button
            type="button"
            onClick={() => setView('settings')}
            className="shrink-0 w-9 h-9 border border-white/10 text-zinc-400 hover:text-white hover:bg-white/10 transition-colors flex items-center justify-center"
            aria-label="Settings"
          >
            <Icons.Gear width={16} height={16} />
          </button>
        </header>
      );
    };
    const SiteFooter = ({ currentView }) => {
      useEffect(() => {
        if (typeof window === 'undefined') return undefined;
        if (!window.matchMedia('(min-width: 768px)').matches) return undefined;
        const timer = window.setTimeout(() => {
          const root = document.querySelector('[data-smoke-view]');
          if (!root) return;
          const div = document.createElement('div');
          div.className = 'site-footer';
          div.innerHTML = `
            <div class="site-footer-legal">
              <a href="./privacy-policy">Privacy Policy</a>
              <a href="./privacy-policy#disclaimer">Legal &amp; Disclaimer</a>
              <span>Operator data &copy; Rainbow Six Wiki contributors (CC-BY-SA)</span>
            </div>`;
          const article = root.querySelector('.cx-article');
          if (article) {
            article.appendChild(div);
            return;
          }
          const candidates = [root, ...Array.from(root.querySelectorAll('.overflow-y-auto'))]
            .filter((el) => el.classList.contains('overflow-y-auto'));
          const scroller = candidates.sort((a, b) => b.scrollHeight - a.scrollHeight)[0];
          if (!scroller || scroller.scrollHeight <= scroller.clientHeight + 50) return;
          scroller.appendChild(div);
          return;
        }, 60);
        return () => {
          document.querySelectorAll('.site-footer').forEach((el) => el.remove());
          window.clearTimeout(timer);
        };
      }, [currentView]);
      return null;
    };
    const WebsiteHeader = ({ currentView, setView, titleOverride, onOpenDrawer }) => {
      const headerTitle = currentView === 'home' ? 'Search' : (titleOverride || getNavDisplayLabel(currentView));
      return (
        <header className="website-topbar shrink-0 px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
          <div className="flex items-center gap-1 min-w-0">
          {onOpenDrawer && (
            <button type="button" onClick={onOpenDrawer} className="cx-hamb" aria-label="Open navigation">
              <span aria-hidden="true" /><span aria-hidden="true" /><span aria-hidden="true" />
            </button>
          )}
          <button onClick={() => setView('home')} className="group flex items-center gap-3 min-w-0 text-left" aria-label="Open search">
            <div className="website-brand-mark w-9 h-9 shrink-0 flex items-center justify-center border border-white/15">
              <img src="./assets/wiki-logo.png" alt="" width={30} height={30} style={{ objectFit: 'contain' }} />
            </div>
            <div className="min-w-0">
              <p className="text-[9px] font-bold uppercase tracking-[0.32em] text-zinc-500">Siege Wiki</p>
              <h1 className="text-lg text-[var(--text)] truncate" style={{ fontFamily: 'var(--font-display)', fontWeight: 600, letterSpacing: '0.01em' }}>{headerTitle}</h1>
            </div>
          </button>
          </div>
          <div className="hidden md:flex items-center gap-5">
            <span style={{ fontFamily: 'var(--mono-fallback, ui-monospace, monospace)', fontSize: '10px', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--faint, var(--muted))' }}>
              {META.gameVersion} · synced {META.lastSynced}
            </span>
          </div>
          <button
            onClick={() => setView('settings')}
            className="shrink-0 w-10 h-10 border border-white/10 bg-white/[0.035] text-zinc-400 hover:text-white hover:bg-white/10 transition-colors flex items-center justify-center"
            aria-label="Open settings"
          >
            <Icons.Gear width={18} height={18} />
          </button>
        </header>
      );
    };
    const SiteLegalFooter = ({ className = '' }) => (
      <div className={`flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-zinc-500 ${className}`}>
        <a href="./privacy-policy" className="hover:text-zinc-300 transition-colors">Privacy Policy</a>
        <a href="./privacy-policy#disclaimer" className="hover:text-zinc-300 transition-colors">Legal &amp; Disclaimer</a>
        <span>Operator data &copy; Rainbow Six Wiki contributors (CC-BY-SA)</span>
      </div>
    );
    const Navigation = ({ currentView, setView, theme, isMobile = false, customNavItems = [], extraCounts = {} }) => {
      const navItems = useMemo(() => {
        const items = [{ id: 'home', label: 'Search' }];
        customNavItems.forEach(id => {
          const opt = ALL_NAV_OPTIONS.find(o => o.id === id);
          if (opt) items.push(opt);
        });
        items.push({ id: 'settings', label: 'Settings' });
        return items;
      }, [customNavItems]);
      const navCounts = useMemo(() => {
        const favCount = () => {
          try {
            const s = JSON.parse(localStorage.getItem(R6_STORAGE_KEYS.favorites)) || {};
            return ['favoriteOperators', 'favoriteMaps', 'favoriteSeasons'].reduce((n, k) => n + ((s[k] || []).length), 0);
          } catch { return 0; }
        };
        return {
          operators: OPERATORS.length,
          gadgets: OPERATORS.length,
          maps: MAPS.length,
          seasons: SEASONS.length,
          favorites: favCount(),
          ...extraCounts,
        };
      }, [currentView]);
      const hasMany = navItems.length > 6;
      const containerClasses = isMobile
        ? 'nav-shell nav-scroll rounded-2xl px-3 py-2 border border-white/5 max-w-3xl w-full mx-auto'
        : `nav-shell rounded-2xl sm:rounded-full px-3 py-2 border border-white/5 ${hasMany ? 'max-w-5xl' : 'max-w-4xl'} w-full mx-auto`;
      const trackClasses = isMobile
        ? 'flex items-center gap-1 justify-center w-full overflow-x-auto nav-scroll px-1'
        : 'flex items-center gap-1 justify-center w-full';
      if (!isMobile) {
        return (
          <aside className="website-sidebar cx-side relative z-10 hidden md:flex h-full shrink-0 flex-col">
            <nav className="website-sidebar-scroll flex-1 overflow-y-auto cx-side-nav">
              <button
                onClick={() => setView('home')}
                className={`cx-side-link ${currentView === 'home' ? 'cx-side-link--active' : ''} cx-side-mainpage`}
              >
                <span className="truncate">Main page</span>
              </button>
              {WEBSITE_NAV_SECTIONS.map((section) => (
                <div key={section.label}>
                  <h5 className="cx-side-h5">{section.label}</h5>
                  {section.ids.map((id) => {
                    const isActive = currentView === id;
                    const count = navCounts[id];
                    return (
                      <button
                        key={id}
                        onClick={() => setView(id)}
                        className={`cx-side-link ${isActive ? 'cx-side-link--active' : ''}`}
                      >
                        <span className="truncate">{getNavDisplayLabel(id)}</span>
                        {typeof count === 'number' && count > 0 ? <span className="cx-side-count">{count}</span> : null}
                      </button>
                    );
                  })}
                </div>
              ))}
            </nav>
          </aside>
        );
      }
      return (
        <div className="fixed bottom-0 left-0 w-full z-50 px-2 sm:px-6 pb-2 sm:pb-5 flex flex-col items-center gap-2 nav-safe-area">
          <div className={containerClasses}>
            <div className={trackClasses}>
              {navItems.map((item) => {
                const isActive = currentView === item.id;
                const labelVisibility = (isMobile || hasMany) ? (isActive ? '' : 'hidden') : '';
                const IconComponent = Icons[NAV_ICON_MAP[item.id]] || Icons.Zap;
                return (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    aria-label={item.label}
                    className={`nav-item ${isMobile ? 'shrink-0 flex items-center justify-center gap-2 rounded-xl px-3 py-2' : `flex-1 flex items-center justify-center gap-2 rounded-xl sm:rounded-full py-2.5 ${hasMany ? 'px-3' : ''}`} transition-all duration-200 ${isActive ? 'nav-item--active' : 'hover:text-white'}`}
                    style={isActive ? { borderColor: theme.accent } : {}}
                  >
                    <IconComponent width={20} height={20} strokeWidth={isActive ? 2.3 : 2} />
                    <span className={`text-[11px] font-semibold ${labelVisibility} ${isActive ? 'text-white' : 'text-zinc-400'}`}>{item.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    };
    const App = () => {
      const device = useDeviceProfile();
      const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...(loadFromStorage(R6_STORAGE_KEYS.settings, {})) }));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.settings, settings); }, [settings]);
      const [favorites, setFavorites] = useState(() => loadFromStorage(R6_STORAGE_KEYS.favorites, { operators: [], maps: [], seasons: [] }));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.favorites, favorites); }, [favorites]);

      const initialUi = useMemo(() => {
        try {
          const ctx = readLaunchContext();
          const allowed = new Set(['home', ...ARTICLE_VIEWS, ...ALL_NAV_OPTIONS.map((o) => o.id)]);
          return { view: allowed.has(ctx.view) ? ctx.view : 'home', context: ctx.view === 'home' ? {} : { id: (ctx.context && ctx.context.id) || undefined } };
        } catch (e) { return { view: 'home', context: {} }; }
      }, []);
      const [currentView, setCurrentView] = useState(initialUi.view);
      const [viewContext, setViewContext] = useState(initialUi.context);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const mainRef = useRef(null);
      const setView = useCallback((view, context = {}) => {
        setCurrentView(view); setViewContext(context || {});
        setDrawerOpen(false);
        triggerHaptic('Light');
      }, []);

      useEffect(() => {
        const rootEl = document.documentElement;
        const palette = COLOR_MODES[settings.colorMode] || COLOR_MODES.oled;
        rootEl.style.setProperty('--bg-01', palette.bg01);
        rootEl.style.setProperty('--bg-02', palette.bg02);
        rootEl.style.setProperty('--panel', palette.panel);
        rootEl.style.setProperty('--stroke', palette.stroke);
        rootEl.style.setProperty('--chip', palette.chip);
        rootEl.style.setProperty('--text', palette.text);
        rootEl.style.setProperty('--muted', palette.muted);
        rootEl.style.setProperty('--nav-bg', palette.nav);
        rootEl.style.setProperty('--glass-bg', palette.glass);
        rootEl.style.setProperty('--ghost-surface', palette.ghost);
        rootEl.style.setProperty('--ghost-strong', palette.ghostStrong);
        rootEl.style.setProperty('--shadow-soft', palette.shadowSoft);
        rootEl.style.setProperty('--shadow-strong', palette.shadowStrong);
        rootEl.style.setProperty('--site-shell-bg', palette.appShellBg);
        rootEl.style.setProperty('--ambient-glow', palette.ambientGlow);
        rootEl.style.setProperty('--ambient-opacity', palette.ambientOpacity);
        rootEl.style.setProperty('--selection-bg', palette.selectionBg);
        rootEl.style.setProperty('--selection-text', palette.selectionText);
        const gameAccent = (typeof GAME_ACCENT !== 'undefined' && GAME_ACCENT) || {};
        rootEl.style.setProperty('--accent', gameAccent.accent || palette.accent);
        rootEl.style.setProperty('--accent-soft', gameAccent.accentSoft || palette.accentSoft);
        if (typeof ACCENT_COLOR === 'string' && ACCENT_COLOR) rootEl.style.setProperty('--accent', ACCENT_COLOR);
        if (typeof ACCENT_SOFT === 'string' && ACCENT_SOFT) rootEl.style.setProperty('--accent-soft', ACCENT_SOFT);
        rootEl.style.fontSize = settings.fontSize === 'small' ? '14px' : settings.fontSize === 'large' ? '18px' : '16px';
        document.body.classList.toggle('light-mode', settings.colorMode === 'light');
        document.body.classList.toggle('oled-mode', settings.colorMode === 'oled');
      }, [settings.colorMode, settings.fontSize]);

      useEffect(() => {
        try {
          const suffix = SEO_SUFFIX;
          const viewLabels = SEO_VIEW_LABELS;
          let title = SEO_DEFAULT_TITLE;
          const id = viewContext.id;
          if (id) {
            const pools = [OPERATORS, MAPS];
            let entry = null;
            for (const pool of pools) { entry = (pool || []).find((e) => e && e.id === id) || null; if (entry) break; }
            if (!entry) entry = SEASONS.find((s) => s && s.id === id) || null;
            if (entry && entry.name) title = `${entry.name}${suffix}`;
            else if (viewLabels[currentView]) title = `${viewLabels[currentView]}${suffix}`;
          } else if (viewLabels[currentView]) {
            title = `${viewLabels[currentView]}${suffix}`;
          }
          document.title = title;
          const siteBase = SEO_SITE_BASE;
          let canonical = siteBase + '/';
          if (currentView && currentView !== 'home') {
            canonical = siteBase + '/?view=' + encodeURIComponent(currentView);
            if (id) canonical += '&id=' + encodeURIComponent(id);
          }
          const canonicalLink = document.querySelector('link[rel="canonical"]');
          if (canonicalLink) canonicalLink.setAttribute('href', canonical);
          const ogUrlTag = document.querySelector('meta[property="og:url"]');
          if (ogUrlTag) ogUrlTag.setAttribute('content', canonical);
          const ogTitleTag = document.querySelector('meta[property="og:title"]');
          if (ogTitleTag) ogTitleTag.setAttribute('content', title);
        } catch (e) { }
      }, [currentView, viewContext]);

      const theme = useMemo(() => {
        const gameAccent = (typeof GAME_ACCENT !== 'undefined' && GAME_ACCENT) || {};
        const palette = COLOR_MODES[settings.colorMode] || COLOR_MODES.oled;
        return { accent: gameAccent.accent || palette.accent, accentSoft: gameAccent.accentSoft || palette.accentSoft };
      }, [settings.colorMode]);
      useEffect(() => { window.__hideLaunchOverlay?.(); }, []);
      const touchStartRef = useRef(null);
      const navOrder = useMemo(() => ['home', 'favorites'], []);
      const isAnyOverlayOpen = drawerOpen;
      const handleTouchStart = (e) => {
        if (!e.touches || e.touches.length !== 1) {
          touchStartRef.current = null;
          return;
        }
        touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      };
      const handleTouchEnd = (e) => {
        const start = touchStartRef.current;
        touchStartRef.current = null;
        if (!start) return;
        if (isAnyOverlayOpen) return;
        const target = e.target;
        if (target && target.closest && target.closest('input, textarea, select, [data-no-swipe], table.cx-wikitable, .overflow-x-auto, .nav-scroll')) return;
        const touchEnd = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        const diffX = start.x - touchEnd.x;
        const diffY = start.y - touchEnd.y;
        const minSwipe = 100;
        const isHorizontalSwipe = Math.abs(diffX) > minSwipe && Math.abs(diffX) > Math.abs(diffY) * 1.5;
        if (isHorizontalSwipe) {
          const currentIndex = navOrder.indexOf(currentView);
          if (currentIndex === -1) return;
          if (diffX > 0 && currentIndex < navOrder.length - 1) {
            setView(navOrder[currentIndex + 1]);
            triggerHaptic('Light');
          } else if (diffX < 0 && currentIndex > 0) {
            setView(navOrder[currentIndex - 1]);
            triggerHaptic('Light');
          }
        }
      };
      const [notes, setNotes] = useState(() => loadFromStorage(R6_STORAGE_KEYS.notes, {}));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.notes, notes); }, [notes]);
      const getEntityNote = useCallback((type, id) => (notes[getNoteKey(type, id)] || ''), [notes]);
      const setEntityNote = useCallback((type, id, value) => {
        setNotes((prev) => ({ ...prev, [getNoteKey(type, id)]: value }));
      }, []);
      const toggleFavorite = useCallback((category, itemId) => {
        const key = FAVORITE_KEYS[category];
        if (!key) return;
        setFavorites((prev) => {
          const favs = prev[key] || [];
          return { ...prev, [key]: favs.includes(itemId) ? favs.filter((v) => v !== itemId) : [...favs, itemId] };
        });
        triggerHaptic('Light');
      }, []);

      const headerTitle = useMemo(() => {
        if (viewContext.id) {
          const entry = operatorsById.get(viewContext.id) || mapsById.get(viewContext.id) || seasonsById.get(viewContext.id);
          if (entry) return entry.name;
        }
        return getNavDisplayLabel(currentView);
      }, [currentView, viewContext]);

      const renderContent = () => {
        const id = viewContext.id;
        switch (currentView) {
          case 'operators': return <OperatorsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'operator': return <OperatorArticle id={id} setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} note={getEntityNote('operator', id)} onNoteChange={(v) => setEntityNote('operator', id, v)} />;
          case 'gadgets': return <GadgetsView setView={setView} />;
          case 'maps': return <MapsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'map': return <MapArticle id={id} setView={setView} note={getEntityNote('map', id)} onNoteChange={(v) => setEntityNote('map', id, v)} />;
          case 'seasons': return <SeasonsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'season': return <SeasonArticle id={id} setView={setView} note={getEntityNote('season', id)} onNoteChange={(v) => setEntityNote('season', id, v)} />;
          case 'favorites': return <FavoritesView favorites={favorites} setView={setView} onToggleFavorite={toggleFavorite} />;
          case 'settings': return <SettingsView settings={settings} setSettings={setSettings} />;
          default: return <HomeView setView={setView} counts={{ operators: OPERATORS.length, maps: MAPS.length, seasons: SEASONS.length }} />;
        }
      };

      return (
        <div data-smoke-ready="true" data-smoke-view={currentView} data-smoke-profile={viewContext.id || ''} className="site-shell website-shell flex flex-col h-screen w-full text-slate-100 overflow-hidden relative" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
          {!device.isMobile && <WikiHeader currentView={currentView} setView={setView} />}
          <SiteFooter currentView={currentView} />
          {device.isMobile && <WebsiteHeader currentView={currentView} setView={setView} onOpenDrawer={() => setDrawerOpen(true)} titleOverride={headerTitle !== getNavDisplayLabel(currentView) ? headerTitle : null} />}
          <div className="website-workspace relative z-10 flex-1 min-h-0 flex">
            {!device.isMobile && <Navigation currentView={currentView} setView={setView} theme={theme} isMobile={false} customNavItems={DEFAULT_SETTINGS.navItems} />}
            <main ref={mainRef} className="website-main relative flex-1 min-w-0 overflow-hidden"><div key={currentView + (viewContext.id || '')} className="view-transition h-full overflow-y-auto" style={{ padding: '20px 16px 120px' }}>{renderContent()}</div></main>
          </div>
          {device.isMobile && <SectionDrawer open={drawerOpen} currentView={currentView} onBrowse={(vid) => setView(vid)} onClose={() => setDrawerOpen(false)} />}
          <ScrollToTopFAB mainRef={mainRef} currentView={currentView} />
          {device.isMobile && (
            <div className="fixed bottom-0 left-0 w-full z-[55] px-2 sm:px-6 pb-2 sm:pb-5 flex flex-col items-center gap-2 nav-safe-area">
              <AppToolbar currentView={currentView} drawerOpen={drawerOpen} onSearch={() => setView('home')} onSections={() => { setDrawerOpen(true); triggerHaptic('Light'); }} onSaved={() => setView('favorites')} onSettings={() => setView('settings')} />
            </div>
          )}
        </div>
      );
    };

    if (typeof R6_DATABASE === 'undefined') {
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#e5e7eb;background:#090b11;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif"><h2>Game data failed to load</h2></div>';
    } else {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }
  </script>
</body>

</html>
