    const SiteLegalFooter = ({ className = '' }) => (
      <div className={`flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-zinc-500 ${className}`}>
        <a href="./privacy-policy" className="hover:text-zinc-300 transition-colors">Privacy Policy</a>
        <a href="./privacy-policy#disclaimer" className="hover:text-zinc-300 transition-colors">Legal &amp; Disclaimer</a>
        <span>Operator data &copy; Rainbow Six Wiki contributors (CC-BY-SA)</span>
      </div>
    );
    const Navigation = ({ currentView, setView, theme, isMobile = false, customNavItems = [], extraCounts = {} }) => {
      const navItems = useMemo(() => {
        const items = [{ id: 'home', label: 'Search' }];
        customNavItems.forEach(id => {
          const opt = ALL_NAV_OPTIONS.find(o => o.id === id);
          if (opt) items.push(opt);
        });
        items.push({ id: 'settings', label: 'Settings' });
        return items;
      }, [customNavItems]);
      const navCounts = useMemo(() => {
        const favCount = () => {
          try {
            const s = JSON.parse(localStorage.getItem(R6_STORAGE_KEYS.favorites)) || {};
            return ['favoriteOperators', 'favoriteMaps', 'favoriteSeasons'].reduce((n, k) => n + ((s[k] || []).length), 0);
          } catch { return 0; }
        };
        return {
          operators: OPERATORS.length,
          gadgets: OPERATORS.length,
          weapons: WEAPONS.length,
          maps: MAPS.length,
          seasons: SEASONS.length,
          favorites: favCount(),
          ...extraCounts,
        };
      }, [currentView]);
      const hasMany = navItems.length > 6;
      const containerClasses = isMobile
        ? 'nav-shell nav-scroll rounded-2xl px-3 py-2 border border-white/5 max-w-3xl w-full mx-auto'
        : `nav-shell rounded-2xl sm:rounded-full px-3 py-2 border border-white/5 ${hasMany ? 'max-w-5xl' : 'max-w-4xl'} w-full mx-auto`;
      const trackClasses = isMobile
        ? 'flex items-center gap-1 justify-center w-full overflow-x-auto nav-scroll px-1'
        : 'flex items-center gap-1 justify-center w-full';
      if (!isMobile) {
        return (
          <aside className="website-sidebar cx-side relative z-10 hidden md:flex h-full shrink-0 flex-col">
            <nav className="website-sidebar-scroll flex-1 overflow-y-auto cx-side-nav">
              <button
                onClick={() => setView('home')}
                className={`cx-side-link ${currentView === 'home' ? 'cx-side-link--active' : ''} cx-side-mainpage`}
              >
                <span className="truncate">Main page</span>
              </button>
              {WEBSITE_NAV_SECTIONS.map((section) => (
                <div key={section.label}>
                  <h5 className="cx-side-h5">{section.label}</h5>
                  {section.ids.map((id) => {
                    const isActive = currentView === id;
                    const count = navCounts[id];
                    return (
                      <button
                        key={id}
                        onClick={() => setView(id)}
                        className={`cx-side-link ${isActive ? 'cx-side-link--active' : ''}`}
                      >
                        <span className="truncate">{getNavDisplayLabel(id)}</span>
                        {typeof count === 'number' && count > 0 ? <span className="cx-side-count">{count}</span> : null}
                      </button>
                    );
                  })}
                </div>
              ))}
            </nav>
          </aside>
        );
      }
      return (
        <div className="fixed bottom-0 left-0 w-full z-50 px-2 sm:px-6 pb-2 sm:pb-5 flex flex-col items-center gap-2 nav-safe-area">
          <div className={containerClasses}>
            <div className={trackClasses}>
              {navItems.map((item) => {
                const isActive = currentView === item.id;
                const labelVisibility = (isMobile || hasMany) ? (isActive ? '' : 'hidden') : '';
                const IconComponent = Icons[NAV_ICON_MAP[item.id]] || Icons.Zap;
                return (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    aria-label={item.label}
                    className={`nav-item ${isMobile ? 'shrink-0 flex items-center justify-center gap-2 rounded-xl px-3 py-2' : `flex-1 flex items-center justify-center gap-2 rounded-xl sm:rounded-full py-2.5 ${hasMany ? 'px-3' : ''}`} transition-all duration-200 ${isActive ? 'nav-item--active' : 'hover:text-white'}`}
                    style={isActive ? { borderColor: theme.accent } : {}}
                  >
                    <IconComponent width={20} height={20} strokeWidth={isActive ? 2.3 : 2} />
                    <span className={`text-[11px] font-semibold ${labelVisibility} ${isActive ? 'text-white' : 'text-zinc-400'}`}>{item.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    };
    const App = () => {
      const device = useDeviceProfile();
      const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...(loadFromStorage(R6_STORAGE_KEYS.settings, {})) }));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.settings, settings); }, [settings]);
      const [favorites, setFavorites] = useState(() => loadFromStorage(R6_STORAGE_KEYS.favorites, { operators: [], maps: [], seasons: [] }));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.favorites, favorites); }, [favorites]);

      const initialUi = useMemo(() => {
        try {
          const ctx = readLaunchContext();
          const allowed = new Set(['home', ...ARTICLE_VIEWS, ...ALL_NAV_OPTIONS.map((o) => o.id)]);
          return { view: allowed.has(ctx.view) ? ctx.view : 'home', context: ctx.view === 'home' ? {} : { id: (ctx.context && ctx.context.id) || undefined } };
        } catch (e) { return { view: 'home', context: {} }; }
      }, []);
      const [currentView, setCurrentView] = useState(initialUi.view);
      const [viewContext, setViewContext] = useState(initialUi.context);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [floorModal, setFloorModal] = useState(null);
      const mainRef = useRef(null);
      const setView = useCallback((view, context = {}) => {
        setCurrentView(view); setViewContext(context || {});
        setDrawerOpen(false);
        triggerHaptic('Light');
      }, []);

      useEffect(() => {
        const rootEl = document.documentElement;
        const palette = COLOR_MODES[settings.colorMode] || COLOR_MODES.oled;
        rootEl.style.setProperty('--bg-01', palette.bg01);
        rootEl.style.setProperty('--bg-02', palette.bg02);
        rootEl.style.setProperty('--panel', palette.panel);
        rootEl.style.setProperty('--stroke', palette.stroke);
        rootEl.style.setProperty('--chip', palette.chip);
        rootEl.style.setProperty('--text', palette.text);
        rootEl.style.setProperty('--muted', palette.muted);
        rootEl.style.setProperty('--nav-bg', palette.nav);
        rootEl.style.setProperty('--glass-bg', palette.glass);
        rootEl.style.setProperty('--ghost-surface', palette.ghost);
        rootEl.style.setProperty('--ghost-strong', palette.ghostStrong);
        rootEl.style.setProperty('--shadow-soft', palette.shadowSoft);
        rootEl.style.setProperty('--shadow-strong', palette.shadowStrong);
        rootEl.style.setProperty('--site-shell-bg', palette.appShellBg);
        rootEl.style.setProperty('--ambient-glow', palette.ambientGlow);
        rootEl.style.setProperty('--ambient-opacity', palette.ambientOpacity);
        rootEl.style.setProperty('--selection-bg', palette.selectionBg);
        rootEl.style.setProperty('--selection-text', palette.selectionText);
        const gameAccent = (typeof GAME_ACCENT !== 'undefined' && GAME_ACCENT) || {};
        rootEl.style.setProperty('--accent', gameAccent.accent || palette.accent);
        rootEl.style.setProperty('--accent-soft', gameAccent.accentSoft || palette.accentSoft);
        if (typeof ACCENT_COLOR === 'string' && ACCENT_COLOR) rootEl.style.setProperty('--accent', ACCENT_COLOR);
        if (typeof ACCENT_SOFT === 'string' && ACCENT_SOFT) rootEl.style.setProperty('--accent-soft', ACCENT_SOFT);
        rootEl.style.fontSize = settings.fontSize === 'small' ? '14px' : settings.fontSize === 'large' ? '18px' : '16px';
        document.body.classList.toggle('light-mode', settings.colorMode === 'light');
        document.body.classList.toggle('oled-mode', settings.colorMode === 'oled');
      }, [settings.colorMode, settings.fontSize]);

      useEffect(() => {
        try {
          const suffix = SEO_SUFFIX;
          const viewLabels = SEO_VIEW_LABELS;
          let title = SEO_DEFAULT_TITLE;
          const id = viewContext.id;
          if (id) {
            const pools = [OPERATORS, MAPS];
            let entry = null;
            for (const pool of pools) { entry = (pool || []).find((e) => e && e.id === id) || null; if (entry) break; }
            if (!entry) entry = SEASONS.find((s) => s && s.id === id) || null;
            if (!entry && currentView === 'weapon' && id) {
              const w = weaponsByName.get(id) || resolveWeapon(id);
              if (w && w.name) entry = w;
            }
            if (!entry && currentView === 'gadget' && id) {
              const g = gadgetsById.get(id);
              if (g && g.name) entry = g;
            }
            if (entry && entry.name) title = `${entry.name}${suffix}`;
            else if (viewLabels[currentView]) title = `${viewLabels[currentView]}${suffix}`;
          } else if (viewLabels[currentView]) {
            title = `${viewLabels[currentView]}${suffix}`;
          }
          document.title = title;
          const siteBase = SEO_SITE_BASE;
          let canonical = siteBase + '/';
          if (currentView && currentView !== 'home') {
            canonical = siteBase + '/?view=' + encodeURIComponent(currentView);
            if (id) canonical += '&id=' + encodeURIComponent(id);
          }
          const canonicalLink = document.querySelector('link[rel="canonical"]');
          if (canonicalLink) canonicalLink.setAttribute('href', canonical);
          const ogUrlTag = document.querySelector('meta[property="og:url"]');
          if (ogUrlTag) ogUrlTag.setAttribute('content', canonical);
          const ogTitleTag = document.querySelector('meta[property="og:title"]');
          if (ogTitleTag) ogTitleTag.setAttribute('content', title);
        } catch (e) { }
      }, [currentView, viewContext]);

      const theme = useMemo(() => {
        const gameAccent = (typeof GAME_ACCENT !== 'undefined' && GAME_ACCENT) || {};
        const palette = COLOR_MODES[settings.colorMode] || COLOR_MODES.oled;
        return { accent: gameAccent.accent || palette.accent, accentSoft: gameAccent.accentSoft || palette.accentSoft };
      }, [settings.colorMode]);
      useEffect(() => { window.__hideLaunchOverlay?.(); }, []);
      const touchStartRef = useRef(null);
      const navOrder = useMemo(() => ['home', 'favorites'], []);
      const isAnyOverlayOpen = drawerOpen || !!floorModal;
      const handleTouchStart = (e) => {
        if (!e.touches || e.touches.length !== 1) {
          touchStartRef.current = null;
          return;
        }
        touchStartRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      };
      const handleTouchEnd = (e) => {
        const start = touchStartRef.current;
        touchStartRef.current = null;
        if (!start) return;
        if (isAnyOverlayOpen) return;
        const target = e.target;
        if (target && target.closest && target.closest('input, textarea, select, [data-no-swipe], table.cx-wikitable, .overflow-x-auto, .nav-scroll')) return;
        const touchEnd = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        const diffX = start.x - touchEnd.x;
        const diffY = start.y - touchEnd.y;
        const minSwipe = 100;
        const isHorizontalSwipe = Math.abs(diffX) > minSwipe && Math.abs(diffX) > Math.abs(diffY) * 1.5;
        if (isHorizontalSwipe) {
          const currentIndex = navOrder.indexOf(currentView);
          if (currentIndex === -1) return;
          if (diffX > 0 && currentIndex < navOrder.length - 1) {
            setView(navOrder[currentIndex + 1]);
            triggerHaptic('Light');
          } else if (diffX < 0 && currentIndex > 0) {
            setView(navOrder[currentIndex - 1]);
            triggerHaptic('Light');
          }
        }
      };
      const [notes, setNotes] = useState(() => loadFromStorage(R6_STORAGE_KEYS.notes, {}));
      useEffect(() => { saveToStorage(R6_STORAGE_KEYS.notes, notes); }, [notes]);
      const getEntityNote = useCallback((type, id) => (notes[getNoteKey(type, id)] || ''), [notes]);
      const setEntityNote = useCallback((type, id, value) => {
        setNotes((prev) => ({ ...prev, [getNoteKey(type, id)]: value }));
      }, []);
      const toggleFavorite = useCallback((category, itemId) => {
        const key = FAVORITE_KEYS[category];
        if (!key) return;
        setFavorites((prev) => {
          const favs = prev[key] || [];
          return { ...prev, [key]: favs.includes(itemId) ? favs.filter((v) => v !== itemId) : [...favs, itemId] };
        });
        triggerHaptic('Light');
      }, []);

      const headerTitle = useMemo(() => {
        if (viewContext.id) {
          const entry = operatorsById.get(viewContext.id) || mapsById.get(viewContext.id) || seasonsById.get(viewContext.id)
            || gadgetsById.get(viewContext.id) || weaponsByName.get(viewContext.id) || resolveWeapon(viewContext.id);
          if (entry) return entry.name;
        }
        return getNavDisplayLabel(currentView);
      }, [currentView, viewContext]);

      // Honor #section deep links (shared URLs, reloads): the article
      // renders after navigation, so scroll once it exists.
      useEffect(() => {
        const hash = String(window.location.hash || '').replace(/^#/, '');
        if (!hash) return;
        let tries = 0;
        const tick = () => {
          tries += 1;
          const el = document.getElementById(hash);
          if (el && typeof scrollToAnchor === 'function') {
            scrollToAnchor(hash);
            return;
          }
          if (el) {
            try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch { el.scrollIntoView(); }
            return;
          }
          if (tries < 10) setTimeout(tick, 300);
        };
        setTimeout(tick, 400);
      }, [currentView, viewContext]);

      const renderContent = () => {
        const id = viewContext.id;
        switch (currentView) {
          case 'operators': return <OperatorsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'operator': return <OperatorArticle id={id} setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} note={getEntityNote('operator', id)} onNoteChange={(v) => setEntityNote('operator', id, v)} />;
          case 'gadgets': return <GadgetsView setView={setView} />;
          case 'gadget': return <GadgetArticle id={id} setView={setView} />;
          case 'weapon': return <WeaponArticle id={id} setView={setView} />;
          case 'weapons': return <WeaponsView setView={setView} />;
          case 'attachments': return <AttachmentsView setView={setView} />;
          case 'maps': return <MapsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'map': return <MapArticle id={id} setView={setView} note={getEntityNote('map', id)} onNoteChange={(v) => setEntityNote('map', id, v)} onOpenLayout={(index) => setFloorModal({ mapId: id, index })} />;
          case 'seasons': return <SeasonsView setView={setView} favorites={favorites} onToggleFavorite={toggleFavorite} />;
          case 'season': return <SeasonArticle id={id} setView={setView} note={getEntityNote('season', id)} onNoteChange={(v) => setEntityNote('season', id, v)} />;
          case 'favorites': return <FavoritesView favorites={favorites} setView={setView} onToggleFavorite={toggleFavorite} />;
          case 'settings': return <SettingsView settings={settings} setSettings={setSettings} onBack={() => setView('home')} />;
          default: return <HomeView setView={setView} counts={{ operators: OPERATORS.length, maps: MAPS.length, seasons: SEASONS.length, weapons: WEAPONS.length }} />;
        }
      };

      return (
        <div data-smoke-ready="true" data-smoke-view={currentView} data-smoke-profile={viewContext.id || ''} className="site-shell website-shell flex flex-col h-screen w-full text-slate-100 overflow-hidden relative" onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
          {!device.isMobile && <WikiHeader currentView={currentView} setView={setView} />}
          <SiteFooter currentView={currentView} />
          {device.isMobile && <WebsiteHeader currentView={currentView} setView={setView} onOpenDrawer={() => setDrawerOpen(true)} titleOverride={headerTitle !== getNavDisplayLabel(currentView) ? headerTitle : null} />}
          <div className="website-workspace relative z-10 flex-1 min-h-0 flex">
            {!device.isMobile && <Navigation currentView={currentView} setView={setView} theme={theme} isMobile={false} customNavItems={DEFAULT_SETTINGS.navItems} />}
            <main ref={mainRef} className="website-main relative flex-1 min-w-0 overflow-hidden"><div key={currentView + (viewContext.id || '')} className="view-transition h-full overflow-y-auto" style={{ padding: '20px 16px 120px' }}>{renderContent()}</div></main>
          </div>
          {device.isMobile && <SectionDrawer open={drawerOpen} currentView={currentView} onBrowse={(vid) => setView(vid)} onClose={() => setDrawerOpen(false)} />}
          {floorModal && mapsById.get(floorModal.mapId) ? (
            <MapFloorModal map={mapsById.get(floorModal.mapId)} initialIndex={floorModal.index} onClose={() => setFloorModal(null)}
              noteValue={getEntityNote('map', floorModal.mapId)} onNoteChange={(v) => setEntityNote('map', floorModal.mapId, v)} />
          ) : null}
          <ScrollToTopFAB mainRef={mainRef} currentView={currentView} />
          {device.isMobile && (
            <div className="fixed bottom-0 left-0 w-full z-[55] px-2 sm:px-6 pb-2 sm:pb-5 flex flex-col items-center gap-2 nav-safe-area">
              <AppToolbar currentView={currentView} drawerOpen={drawerOpen} onSearch={() => setView('home')} onSections={() => { setDrawerOpen(true); triggerHaptic('Light'); }} onSaved={() => setView('favorites')} onSettings={() => setView('settings')} />
            </div>
          )}
        </div>
      );
    };

    if (typeof R6_DATABASE === 'undefined') {
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#e5e7eb;background:#090b11;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif"><h2>Game data failed to load</h2></div>';
    } else {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }
  </script>
</body>

</html>
