<body>
  <div id="launch-overlay" class="launch-overlay" aria-live="polite">
    <div class="launch-stage">
      <img class="launch-logo" src="./assets/loading/r6-logo-static.png" alt="R6 Wiki logo">
      <p class="launch-status">Loading</p>
      <div class="launch-progress-wrap" aria-hidden="true">

  <div id="root"></div>
  <script>
    window.__r6MissingDataScripts = [];
    window.__r6DataScriptError = function (name) {
      window.__r6MissingDataScripts.push(name);
      console.error('[data-script-error]', name, 'failed to load');
    };
  </script>
  <script src="data.js" onerror="window.__r6DataScriptError('data.js')"></script>
  <script src="lore.js" onerror="window.__r6DataScriptError('lore.js')"></script>
  <script src="weapons.js" onerror="window.__r6DataScriptError('weapons.js')"></script>
  <script src="gadgets.js" onerror="window.__r6DataScriptError('gadgets.js')"></script>
  <script src="patches.js" onerror="window.__r6DataScriptError('patches.js')"></script>
  <script src="videos.js" onerror="window.__r6DataScriptError('videos.js')"></script>
  <script>
    (() => {
      const LAUNCH_TIPS = [
        'Drone first, peek second.',
        'Vertical play wins rounds. Open the floor above the site.',
        'A default plant beats a hero play.',
        'Mute jammers stop more than drones.',
        'Reinforce the right walls, not every wall.',
        'Sound is intel. Stop sprinting when it matters.',
        'One ping can save a round. Ping the defuser.',
        'Check your corners, then check them again.',
        'Utility wins executes. Save a smoke for the plant.',
        'Nerf Jackal.',
        'Do not peek everything at once.',
        'The defuser wins games. Protect the carrier.',
      ];
      const overlay = document.getElementById('launch-overlay');
      const tipEl = document.getElementById('launch-overlay-tip');
      const startedAt = Date.now();
      const LAUNCH_OVERLAY_MIN_MS = 400;
      if (tipEl) {
        tipEl.textContent = LAUNCH_TIPS[Math.floor(Math.random() * LAUNCH_TIPS.length)];
      }
      window.__hideLaunchOverlay = (immediate = false) => {
        if (!overlay || overlay.dataset.hidden === 'true') return;
        const hide = () => {
          if (overlay.dataset.hidden === 'true') return;
          overlay.dataset.hidden = 'true';
          overlay.classList.add('launch-overlay--hidden');
          window.setTimeout(() => overlay.remove(), 640);
        };
        const minDuration = immediate ? 0 : LAUNCH_OVERLAY_MIN_MS;
        const remaining = Math.max(0, startedAt + minDuration - Date.now());
        window.setTimeout(hide, remaining);
      };
    })();
  </script>
  <script type="text/babel" src="./engine/icons.js"></script>
  <script type="text/babel" src="./engine/core.js"></script>
  <script type="text/babel" src="./engine/theme.js"></script>
  <script type="text/babel" src="./engine/storage.js"></script>
  <script type="text/babel" src="./engine/device.js"></script>
  <script type="text/babel" src="./engine/shell.js"></script>
  <script type="text/babel" src="./engine/assets.js"></script>
  <script type="text/babel" src="./engine/articles.js"></script>
  <script type="text/babel" src="./games/r6/config.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const DB = (typeof R6_DATABASE !== 'undefined' && R6_DATABASE) || { operators: [], maps: [], seasons: [] };
    const OPERATORS = DB.operators || [];
    const MAPS = DB.maps || [];
    const SEASONS = DB.seasons || [];
    const operatorsById = new Map(OPERATORS.map((op) => [op.id, op]));
    const LORE = (typeof R6_LORE !== 'undefined' && R6_LORE) || {};
    const WEAPON_STORE = (typeof R6_WEAPONS !== 'undefined' && R6_WEAPONS) || { weapons: [], attachments: [], aliases: {} };
    const WEAPONS = WEAPON_STORE.weapons || [];
    const ATTACHMENTS = WEAPON_STORE.attachments || [];
    const WEAPON_ALIASES = WEAPON_STORE.aliases || {};
    const weaponsByName = new Map(WEAPONS.map((w) => [w.name, w]));
    const GADGET_STORE = (typeof R6_GADGETS !== 'undefined' && R6_GADGETS) || { gadgets: [] };
    const GADGETS = GADGET_STORE.gadgets || [];
    const gadgetsById = new Map(GADGETS.map((g) => [g.id, g]));
    const PATCHES = ((typeof R6_PATCHES !== 'undefined' && R6_PATCHES) || { patches: [] }).patches || [];
    const VIDEOS = ((typeof R6_VIDEOS !== 'undefined' && R6_VIDEOS) || { entries: {} }).entries || {};
    const normPatchKey = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
    const patchesForSeason = (season) => {
      if (!season) return [];
      const key = normPatchKey(String(season.name || '').replace(/^operation\s+/i, ''));
      const code = String(season.code || '').match(/Y(\d+)S(\d+)/i);
      // Numbered patches follow <year>.<season>.<n> (10.4.1 → Y10S4).
      const versionRe = code ? new RegExp(`^${Number(code[1])}\\.${Number(code[2])}(?:\\.|\\b)`) : null;
      return PATCHES.filter((p) => {
        if (versionRe && versionRe.test(String(p.version || '').trim())) return true;
        return key && normPatchKey(`${p.version || ''} ${p.highlights || ''}`).includes(key);
      });
    };
    const normOpName = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[øØ]/g, 'o').toLowerCase();
    const normWeaponKey = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
    const resolveWeapon = (name) => {
      if (!name) return null;
      if (weaponsByName.has(name)) return weaponsByName.get(name);
      const alias = WEAPON_ALIASES[normWeaponKey(name)];
      if (alias && weaponsByName.has(alias)) return weaponsByName.get(alias);
      return null;
    };
    const DROPOFF = {
      AR: { close: [0, 25], far: [35, null], mult: 0.6, label: 'Full damage to 25m, 60% past 35m' },
      SMG: { close: [0, 20], far: [28, null], mult: 0.6, label: 'Full damage to 20m, 60% past 28m' },
      MP: { close: [0, 20], far: [28, null], mult: 0.6, label: 'Full damage to 20m, 60% past 28m' },
      DMR: { close: [0, 30], far: [40, null], mult: 0.7, label: 'Full damage to 30m, 70% past 40m' },
      LMG: { close: [0, 25], far: [35, null], mult: 0.65, label: 'Full damage to 25m, 65% past 35m' },
      SR: { close: [0, 30], far: [40, null], mult: 0.8, label: 'Full damage to 30m, 80% past 40m' },
      H: { close: [0, 12], far: [15, null], mult: 0.6, label: 'Full damage to 12m, 60% past 15m' },
      S: { close: [0, 12], far: [15, null], mult: 0.6, label: 'Full damage to 12m, 60% past 15m' },
      SG: { close: [0, 5], far: [12, null], mult: 0.45, label: 'Full damage to 5m, 45% past 12m (per pellet)' },
      SG_BAILIFF: { close: [0, 5], far: [12, null], mult: 0.45, label: 'Full damage to 5m, 45% past 12m (per pellet)' },
    };
    const DropoffChart = ({ weapon }) => {
      const model = weapon.damageModel;
      let close = null, far = null, note = null;
      if (model && model.mode === 'ranged') {
        close = { dmg: model.close.dmg, label: `${model.close.dmg} (${model.close.range[0]}–${model.close.range[1]}m)` };
        far = { dmg: model.far.dmg, label: `${model.far.dmg} (${model.far.range[0]}m+)` };
        if (model.pellets) note = `×${model.pellets} pellets`;
      } else if (model && model.mode === 'class' && DROPOFF[model.class]) {
        const rule = DROPOFF[model.class];
        close = { dmg: model.base, label: `${model.base} (${rule.close[0]}–${rule.close[1]}m)` };
        far = { dmg: Math.round(model.base * rule.mult), label: `${Math.round(model.base * rule.mult)} (${rule.far[0]}m+)` };
        note = rule.label;
      } else return null;
      const max = Math.max(close.dmg, far.dmg, 1);
      const Bar = ({ entry, color }) => (
        <div className="flex items-center gap-2 mb-1">
          <div className="rounded" style={{ width: `${Math.max(4, Math.round((entry.dmg / max) * 160))}px`, height: '10px', background: color }} />
          <span className="text-xs" style={{ color: 'var(--muted)' }}>{entry.label}</span>
        </div>
      );
      return (
        <div className="rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
          <Bar entry={close} color="#3da5e0" />
          <Bar entry={far} color="#8f8a80" />
          {note ? <p className="text-xs mt-1" style={{ color: 'var(--muted)' }}>{note}</p> : null}
        </div>
      );
    };
    const loreParas = (text) => String(text || '').split(/\n\n+/).map((p) => p.trim()).filter(Boolean);
    const mapsById = new Map(MAPS.map((m) => [m.id, m]));
    const seasonsById = new Map(SEASONS.map((s) => [s.id, s]));

    const SIDE_COLOR = { Attacker: '#3da5e0', Defender: '#ccac00' };

    const initials = (name) => String(name || '?').split(/[\s'’-]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

    const OpAvatar = ({ name, side, size = 44 }) => (
      <span className="shrink-0 rounded-full flex items-center justify-center font-bold" style={{ width: size, height: size, fontSize: Math.round(size * 0.36), color: '#fff', background: `linear-gradient(135deg, ${SIDE_COLOR[side] || '#666'}55, #10141f)`, border: `2px solid ${SIDE_COLOR[side] || '#666'}` }} aria-hidden="true">{initials(name)}</span>
    );

    const FavButton = ({ active, onToggle, label }) => (
      <button type="button" onClick={onToggle} aria-label={label} title={label} className="shrink-0 rounded-full p-2 transition-all" style={{ border: '1px solid var(--stroke)', color: active ? '#ffd34d' : 'var(--muted)', background: active ? 'rgba(255,211,77,0.12)' : 'transparent' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill={active ? 'currentColor' : 'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
      </button>
    );

    /* ------------------------------ views --------------------------------- */

    const HomeView = ({ setView, counts }) => {
      const [searchTerm, setSearchTerm] = useState('');
      const deferredQuery = React.useDeferredValue ? React.useDeferredValue(searchTerm) : searchTerm;
      const parseQuery = (raw) => {
        const text = raw.trim();
        const m = text.match(/^(op|map|season|gadget|random):\s*(.*)$/i);
        if (m) return { prefix: m[1].toLowerCase(), text: m[2].trim().toLowerCase() };
        return { prefix: '', text: text.toLowerCase() };
      };
      const { prefix, text: query } = parseQuery(deferredQuery);
      const inScope = (scope) => !prefix || prefix === scope;
      const opHits = query && inScope('op') ? OPERATORS.filter((op) => (op.name + ' ' + op.gadget + ' ' + op.squad + ' ' + op.role).toLowerCase().includes(query)).slice(0, 8) : [];
      const gadgetHits = query && (inScope('gadget') || !prefix) ? OPERATORS.filter((op) => (op.gadget + ' ' + op.name).toLowerCase().includes(query)).slice(0, 6) : [];
      const mapHits = query && inScope('map') ? MAPS.filter((m) => (m.name + ' ' + m.setting).toLowerCase().includes(query)).slice(0, 4) : [];
      const seasonHits = query && inScope('season') ? SEASONS.filter((s) => (s.name + ' ' + s.code).toLowerCase().includes(query)).slice(0, 4) : [];
      const randomOp = prefix === 'random' ? OPERATORS[Math.floor(Math.random() * OPERATORS.length)] : null;
      const browseLinks = [
        { id: 'operators', label: 'Operators', count: counts.operators },
        { id: 'gadgets', label: 'Gadgets', count: counts.operators },
        { id: 'weapons', label: 'Weapons', count: counts.weapons },
        { id: 'maps', label: 'Maps', count: counts.maps },
        { id: 'seasons', label: 'Seasons', count: counts.seasons },
      ];
      const tools = [
        { id: 'operators', tool: 'Operators', purpose: 'Browse all operators' },
        { id: 'gadgets', tool: 'Gadgets', purpose: 'Browse all gadgets' },
        { id: 'weapons', tool: 'Weapons', purpose: 'Browse all weapons' },
        { id: 'maps', tool: 'Maps', purpose: 'Browse all maps' },
        { id: 'seasons', tool: 'Seasons', purpose: 'Browse all seasons' },
        { id: 'favorites', tool: 'Favorites', purpose: 'Your saved operators, maps and seasons' },
        { id: 'settings', tool: 'Settings', purpose: 'Appearance and saved data' },
      ];
      const latestSeasons = [...SEASONS].sort((a, b) => b.year - a.year || b.code.localeCompare(a.code)).slice(0, 2);
      const ResultRow = ({ title, sub, onOpen }) => (
        <div className="p-3 rounded-2xl border flex items-center gap-3 mb-2" style={{ background: 'var(--panel)', borderColor: 'var(--stroke)' }}>
          <span className="min-w-0 flex-1"><span className="block font-semibold truncate" style={{ color: 'var(--text)' }}>{title}</span>
            <span className="block text-xs truncate uppercase" style={{ color: 'var(--muted)' }}>{sub}</span></span>
          <button type="button" onClick={onOpen} className="cx-toolbtn shrink-0">Open</button>
        </div>
      );
      return (
        <div className="cx-article">
          <div className="max-w-3xl mx-auto">
            <div className="relative flex items-center bg-white/5 border border-white/15 rounded-lg p-2">
              <div className="pl-4 text-zinc-400"><Icons.Search width={18} height={18} /></div>
              <input type="text" className="w-full bg-transparent text-white p-3 text-sm sm:text-base font-medium placeholder-zinc-600 focus:outline-none" id="home-search-input" placeholder="Search operators, gadgets, maps, seasons... (op:, map:, season:, gadget:, random:)" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
              {searchTerm ? <button type="button" onClick={() => setSearchTerm('')} className="p-2 mr-1 rounded-xl bg-white/5 text-zinc-300 hover:text-white hover:bg-white/10 transition-colors" aria-label="Clear search"><Icons.X width={18} height={18} /></button> : null}
            </div>
          </div>
          <div className="home-command mt-2 pb-24">
            {prefix === 'random' && randomOp ? (
              <div className="max-w-3xl mx-auto">
                <div className="p-4 rounded-2xl border flex items-center gap-4" style={{ background: 'var(--panel)', borderColor: 'var(--stroke)' }}>
                  <span className="sq-img"><AssetFrame type="Operator" imageUrl={randomOp.icon ? `./${randomOp.icon}` : null} fallbackIcon={<OpAvatar name={randomOp.name} side={randomOp.side} />} /></span>
                  <span><span className="block text-lg font-bold" style={{ color: 'var(--text)', fontFamily: 'var(--font-display)' }}>{randomOp.name}</span>
                    <span className="block text-sm" style={{ color: 'var(--muted)' }}>{randomOp.gadget}</span></span>
                  <span className="flex-1" />
                  <button type="button" onClick={() => setView('operator', { id: randomOp.id })} className="cx-toolbtn">Open</button>
                  <button type="button" onClick={() => setSearchTerm('random: ')} className="cx-toolbtn cx-toolbtn--quiet">Re-roll</button>
                </div>
              </div>
            ) : query ? (
              <div className="max-w-3xl mx-auto">
                <p className="text-sm mb-2" style={{ color: 'var(--muted)' }}>{opHits.length + gadgetHits.length + mapHits.length + seasonHits.length} Matches</p>
                {opHits.map((op) => <ResultRow key={op.id} title={op.name} sub={`Operator · ${op.gadget}`} onOpen={() => setView('operator', { id: op.id })} />)}
                {gadgetHits.filter((g) => !opHits.includes(g)).map((op) => <ResultRow key={'g' + op.id} title={op.gadget} sub={`Gadget · ${op.name}`} onOpen={() => setView('operator', { id: op.id })} />)}
                {mapHits.map((m) => <ResultRow key={m.id} title={m.name} sub="Map" onOpen={() => setView('map', { id: m.id })} />)}
                {seasonHits.map((s) => <ResultRow key={s.id} title={s.name} sub={`Season · ${s.code}`} onOpen={() => setView('season', { id: s.id })} />)}
                {opHits.length + gadgetHits.length + mapHits.length + seasonHits.length === 0 ? <p>No results found.</p> : null}
              </div>
            ) : (
              <div>
                <div className="mp-welcome">
                  <p className="mp-welcome-title">Welcome to <span className="mp-welcome-name">R6 Wiki,</span></p>
                  <p className="mp-welcome-sub">The free Rainbow Six Siege encyclopedia.</p>
                </div>
                <section id="browse">
                  <h2 className="cx-sec">Browse by category</h2>
                  <div className="cx-linkcols">
                    {browseLinks.map((l) => (
                      <div key={l.id}><button type="button" className="cx-alink" onClick={() => setView(l.id)}>{l.label}</button> <span className="cx-cnt">{l.count}</span></div>
                    ))}
                  </div>
                </section>
                <section id="tools">
                  <h2 className="cx-sec">Tools</h2>
                  <table className="cx-wikitable"><thead><tr><th>Tool</th><th>Purpose</th></tr></thead>
                    <tbody>{tools.map((row) => (
                      <tr key={row.id} onClick={() => setView(row.id)} style={{ cursor: 'pointer' }}><td><span className="cx-alink">{row.tool}</span></td><td>{row.purpose}</td></tr>
                    ))}</tbody></table>
                </section>
                <section id="news">
                  <h2 className="cx-sec">Patch notes</h2>
                  <table className="cx-wikitable"><caption>Latest releases from the timeline</caption><thead><tr><th>Release</th><th>Date</th><th>Summary</th></tr></thead>
                    <tbody>{latestSeasons.map((s) => (
                      <tr key={s.id}><td><button type="button" className="cx-alink" onClick={() => setView('season', { id: s.id })}>{s.name}</button></td><td>{s.released || s.code}</td><td>{(s.blurb || '').slice(0, 120)}</td></tr>
                    ))}</tbody></table>
                </section>
                <nav className="cx-cats">Categories: {browseLinks.map((l, i) => (
                  <span key={l.id}>{i > 0 ? <span className="cx-sep"> · </span> : null}<button type="button" className="cx-alink" onClick={() => setView(l.id)}>{l.label}</button></span>
                ))}</nav>
              </div>
            )}
          </div>
          <p className="mt-6 text-xs" style={{ color: 'var(--muted)' }}>Operator, map and season data: Rainbow Six Wiki contributors (CC-BY-SA). Fan project, not affiliated with Ubisoft.</p>
        </div>
      );
    };
    const OperatorsView = ({ setView, favorites, onToggleFavorite }) => {
      const [side, setSide] = useState('All');
      const [q, setQ] = useState('');
      const query = q.trim().toLowerCase();
      const [sort, setSort] = useState('name-az');
      const list = OPERATORS.filter((op) => (side === 'All' || op.side === side) && (!query || (op.name + ' ' + op.gadget + ' ' + op.squad).toLowerCase().includes(query)))
        .sort((a, b) => sort === 'name-za' ? b.name.localeCompare(a.name) : sort === 'side' ? (a.side.localeCompare(b.side) || a.name.localeCompare(b.name)) : a.name.localeCompare(b.name));
      return (
        <div className="cx-article">
          <h1 className="cx-title">Operators</h1>
          <p className="cx-lead">{OPERATORS.length} operators · {OPERATORS.filter((o) => o.side === 'Attacker').length} attackers · {OPERATORS.filter((o) => o.side === 'Defender').length} defenders</p>
          <div className="flex gap-2 my-3">
            {['All', 'Attacker', 'Defender'].map((s) => (
              <button key={s} type="button" onClick={() => setSide(s)} className="rounded-full px-4 py-1.5 text-sm font-semibold" style={{ background: side === s ? 'var(--text)' : 'transparent', color: side === s ? 'var(--bg-01)' : 'var(--muted)', border: '1px solid var(--stroke)' }}>{s}</button>
            ))}
          </div>
          <WikiHeaderSearchPortal>
            <div className="flex gap-2">
              <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter operators..." aria-label="Filter operators"
                className="flex-1 rounded-2xl px-4 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
              <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort operators" className="rounded-2xl px-3 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }}>
                <option value="name-az">A–Z</option>
                <option value="name-za">Z–A</option>
                <option value="side">Side</option>
              </select>
            </div>
          </WikiHeaderSearchPortal>
          <p className="text-sm my-2" style={{ color: 'var(--muted)' }}>{list.length} operators</p>
          {list.map((op) => (
            <div key={op.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
              <button type="button" onClick={() => setView('operator', { id: op.id })} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                <span className="sq-img"><AssetFrame type="Operator" imageUrl={`./r6_images/operators/icons/${op.id}.png`} fallbackIcon={<OpAvatar name={op.name} side={op.side} />} /></span>
                <span className="min-w-0"><span className="block font-semibold truncate" style={{ color: 'var(--text)' }}>{op.name}</span>
                  <span className="block text-xs truncate" style={{ color: 'var(--muted)' }}>{op.gadget} · {op.squad}</span></span>
              </button>
              <FavButton active={(favorites.operators || []).includes(op.id)} onToggle={() => onToggleFavorite('Operator', op.id)} label={`Favorite ${op.name}`} />
            </div>
          ))}
          {list.length === 0 ? <p style={{ color: 'var(--muted)' }}>No operators match.</p> : null}
        </div>
      );
    };

    // Click-to-load YouTube player (no tracking until play; nocookie
    // domain) with local poster art, plus outbound mp4 links (never
    // hotlinked). Videos come from Ubisoft first, community as backup.
    const VideoEmbed = ({ youtubeId, label, source, poster }) => {
      const [play, setPlay] = useState(false);
      if (!youtubeId) return null;
      if (!play) {
        return (
          <button type="button" onClick={() => setPlay(true)} className="relative w-full overflow-hidden rounded-2xl mb-2 text-left" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', aspectRatio: '16 / 9' }} aria-label={`Play ${label || 'operator guide'} video`}>
            {poster ? <img src={`./${poster}`} alt="" className="absolute inset-0 w-full h-full" style={{ objectFit: 'cover' }} loading="lazy" /> : null}
            <span className="absolute inset-0 flex items-center justify-center" aria-hidden="true">
              <span className="flex items-center justify-center rounded-full" style={{ width: '64px', height: '64px', background: 'rgba(0,0,0,0.65)', border: '2px solid var(--text)', color: 'var(--text)', fontSize: '22px' }}>▶</span>
            </span>
            <span className="absolute bottom-2 left-3 text-xs font-semibold" style={{ color: '#fff', textShadow: '0 1px 4px #000' }}>{label || 'Operator guide'}{source ? ` · ${source}` : ''}</span>
          </button>
        );
      }
      return (
        <div className="w-full overflow-hidden rounded-2xl mb-2" style={{ aspectRatio: '16 / 9', background: '#000' }}>
          <iframe width="100%" height="100%" src={`https://www.youtube-nocookie.com/embed/${youtubeId}?rel=0`} title={label || 'Operator guide'} frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen loading="lazy" />
        </div>
      );
    };
    const OperatorArticle = ({ id, setView, favorites, onToggleFavorite, note, onNoteChange }) => {
      const op = operatorsById.get(id);
      if (!op) return <div className="cx-article"><h1 className="cx-title">Not found</h1><p style={{ color: 'var(--muted)' }}>Unknown operator.</p></div>;
      const season = SEASONS.find((s) => s.name === op.season || s.name === `Operation ${op.season}` || op.season === s.name);
      const lore = LORE[id] || {};
      // Sections in article order; the first two present ones render beside
      // the infobox rail (leadExtra) to fill the dead space, the rest below.
      // TOC derives from the same list, so it always mirrors visual order.
      const sections = [
        ...(((lore.tips || []).length || (VIDEOS[id] || []).length) ? [{ id: 'howtoplay', label: 'How to play' }] : []),
        { id: 'gadget', label: 'Gadget' },
        ...((op.weapons || []).length ? [{ id: 'loadout', label: 'Loadout' }] : []),
        ...((lore.biography || lore.ubiBio) ? [{ id: 'biography', label: 'Biography' }] : []),
        ...((lore.psychReport || lore.psychProfile) ? [{ id: 'psych', label: 'Psychological Report' }] : []),
        ...((lore.quotes || []).length ? [{ id: 'quotes', label: 'Quotes' }] : []),
        ...((lore.trivia || []).length ? [{ id: 'trivia', label: 'Trivia' }] : []),
      ];
      const railIds = new Set(sections.slice(0, 2).map((s) => s.id));
      const toc = sections;
      // Operator-wide attachment fit: union of compat matches across the
      // operator's firearms, split into Barrel / Scopes / Side (laser only).
      const opGunKeys = new Set();
      (op.weapons || []).filter((w) => w.slot !== 'gadget').forEach((w) => {
        opGunKeys.add(normWeaponKey(w.name));
        const canon = weaponsByName.get(w.name) || resolveWeapon(w.name);
        if (canon) {
          opGunKeys.add(normWeaponKey(canon.name));
          (canon.aliases || []).forEach((a) => opGunKeys.add(normWeaponKey(a)));
        }
      });
      const opAttach = ATTACHMENTS.filter((a) => (a.compat || []).some((c) => opGunKeys.has(normWeaponKey(c))));
      const opBarrel = opAttach.filter((a) => a.type === 'Barrel');
      const opScopes = opAttach.filter((a) => /sight|scope|telescopic/i.test(`${a.name} ${a.type}`));
      // No attachment-side compat list exists for the Laser upstream — the
      // weapon-side laser flag (79 arms) is the source of truth instead.
      const opSide = (() => {
        const laser = ATTACHMENTS.find((a) => a.name === 'Laser');
        if (!laser) return [];
        const anySlot = (op.weapons || []).filter((w) => w.slot !== 'gadget').some((w) => {
          const canon = weaponsByName.get(w.name) || resolveWeapon(w.name);
          return canon && canon.attachments && canon.attachments.laser;
        });
        return anySlot ? [laser] : [];
      })();
      const hasOpAttach = opBarrel.length + opScopes.length + opSide.length > 0;
      if (hasOpAttach) toc.push({ id: 'attachments', label: 'Attachments' });
      const AttachTable = ({ items }) => (
        <table className="cx-wikitable"><thead><tr><th></th><th>Attachment</th><th>Type</th></tr></thead>
          <tbody>{items.map((a) => (
            <tr key={a.id}><td><span className="sq-img"><AssetFrame type="Gadget" imageUrl={a.image ? `./${a.image}` : null} /></span></td>
              <td><button type="button" className="cx-alink font-semibold" onClick={() => setView('attachments')}>{a.name}</button></td>
              <td>{a.type || '—'}</td></tr>
          ))}</tbody></table>
      );
      const attachNode = hasOpAttach ? (
        <CxSection id="attachments" title="Attachments">
          {opBarrel.length ? (<div className="mb-6"><h3 className="cx-sub">Barrel</h3><AttachTable items={opBarrel} /></div>) : null}
          {opScopes.length ? (<div className="mb-6"><h3 className="cx-sub">Scopes</h3><AttachTable items={opScopes} /></div>) : null}
          {opSide.length ? (<div className="mb-6"><h3 className="cx-sub">Side</h3><AttachTable items={opSide} /></div>) : null}
        </CxSection>
      ) : null;
      const howtoNode = (lore.tips || []).length || (VIDEOS[id] || []).length ? (
        <CxSection id="howtoplay" title="How to play">
          {(VIDEOS[id] || []).filter((v) => v.youtubeId).slice(0, 1).map((v, i) => (
            <VideoEmbed key={'v' + i} youtubeId={v.youtubeId} label={v.label} source={v.source} poster={(lore.tips || [])[0] && (lore.tips || [])[0].poster} />
          ))}
          {(lore.tips || []).map((tip, i) => (
            <div key={i} className="flex items-start gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
              {tip.poster ? <span className="sq-img shrink-0" style={{ width: '120px' }}><AssetFrame type="Gadget" imageUrl={`./${tip.poster}`} /></span> : null}
              <span><span className="block font-bold text-sm" style={{ color: 'var(--text)' }}>{tip.title}</span>
                <span className="block text-sm" style={{ color: 'var(--text)' }}>{tip.text}</span></span>
            </div>
          ))}
          {(VIDEOS[id] || []).filter((v) => v.mp4).slice(0, 1).map((v, i) => (
            <p key={'m' + i} className="text-sm mt-1"><a className="cx-alink" href={v.mp4} target="_blank" rel="noreferrer">▶ {v.label || 'Ability preview'} (Ubisoft video)</a></p>
          ))}
        </CxSection>
      ) : null;
      const gadgetNode = (
        <CxSection id="gadget" title="Gadget">
          <div className="flex items-center gap-3">
            <span className="sq-img"><AssetFrame type="Gadget" imageUrl={op.gadgetIcon ? `./${op.gadgetIcon}` : null} /></span>
            <p><strong>{op.gadget}.</strong> {op.ability}</p>
          </div>
        </CxSection>
      );
      const loadoutNode = (op.weapons || []).length ? (
        <CxSection id="loadout" title="Loadout">
          {[['primary', 'Primaries'], ['secondary', 'Secondaries'], ['gadget', 'Gadgets']].map(([slot, label]) => {
            const items = (op.weapons || []).filter((w) => w.slot === slot);
            if (!items.length) return null;
            return (
              <div key={slot} className="mb-4">
                <h3 className="cx-sub">{label}</h3>
                {items.map((w, i) => (
                  <div key={`${w.name}-${i}`} className="flex items-center gap-3 rounded-2xl p-2.5 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                    {slot === 'gadget' ? (
                      w.gadgetId && gadgetsById.get(w.gadgetId) && gadgetsById.get(w.gadgetId).image ? (
                        <span className="sq-img"><AssetFrame type="Gadget" imageUrl={`./${gadgetsById.get(w.gadgetId).image}`} /></span>
                      ) : null
                    ) : <span className="sq-img"><AssetFrame type="Weapon" imageUrl={((slot !== 'gadget' && resolveWeapon(w.name) && resolveWeapon(w.name).image) ? `./${resolveWeapon(w.name).image}` : (w.image ? `./${w.image}` : null))} /></span>}
                    <span className="min-w-0 flex-1">
                      {slot === 'gadget' && w.gadgetId && gadgetsById.get(w.gadgetId) ? (
                        <button type="button" className="cx-alink font-semibold text-sm text-left" onClick={() => setView('gadget', { id: w.gadgetId })}>{w.name}</button>
                      ) : slot === 'gadget' || !resolveWeapon(w.name) ? (
                        <span className="font-semibold text-sm" style={{ color: 'var(--text)' }}>{w.name}</span>
                      ) : (
                        <button type="button" className="cx-alink font-semibold text-sm text-left" onClick={() => setView('weapon', { id: resolveWeapon(w.name).name })}>{w.name}</button>
                      )}
                      {slot !== 'gadget' && resolveWeapon(w.name) ? (
                        <span className="block text-xs" style={{ color: 'var(--muted)' }}>
                          {[resolveWeapon(w.name).damage ? `${resolveWeapon(w.name).damage} DMG` : null, resolveWeapon(w.name).rof ? `${resolveWeapon(w.name).rof} RPM` : null, resolveWeapon(w.name).magazine || null].filter(Boolean).join(' · ')}
                        </span>
                      ) : null}
                    </span>
                  </div>
                ))}
              </div>
            );
          })}
        </CxSection>
      ) : null;
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page', onClick: () => setView('home') }, { label: 'Operators', onClick: () => setView('operators') }, { label: op.name }]}
          title={op.name}
          hatnote={op.quote ? `\u201c${op.quote}\u201d` : null}
          lead={<p>{(() => {
            const src = lore.howto || ((lore.tips || [])[0] && lore.tips[0].text) || lore.ubiBio || op.ability;
            const sentences = String(src).match(/[^.!?]+[.!?]+/g) || [src];
            const short = (sentences[0] || '') + (sentences[1] || '');
            return short.length > 320 ? short.slice(0, 317).trimEnd() + '…' : short;
          })()}</p>}
          toc={toc}
          leadExtra={<>{railIds.has('howtoplay') && howtoNode}{railIds.has('gadget') && gadgetNode}{railIds.has('loadout') && loadoutNode}</>}
          categories={[op.side + 's', op.squad]}
          infobox={{
            title: op.name, sub: `${op.side} · ${op.squad}`,
            image: op.hero ? `./${op.hero}` : null, imageAlt: op.name, imageType: 'Hero',
            rows: [
              { label: 'Gadget', value: op.gadget },
              { label: 'Role', value: op.role || '—' },
              ...(lore.specialties && lore.specialties.length ? [{ label: 'Specialties', value: lore.specialties.join(', ') }] : []),
              { label: 'Squad', value: op.squad },
              { label: 'Season', value: season ? (<button type="button" className="cx-alink" onClick={() => setView('season', { id: season.id })}>{op.season}</button>) : op.season },
              { label: 'Armor / Speed', value: `${'●'.repeat(op.armor)}${'○'.repeat(Math.max(0, 3 - op.armor))} / ${'●'.repeat(op.speed)}${'○'.repeat(Math.max(0, 3 - op.speed))}` },
              ...(op.realname || lore.realName ? [{ label: 'Real name', value: op.realname || lore.realName }] : []),
              ...((lore.dob || lore.birthplace) ? [{ label: 'Born', value: [lore.birthplace, lore.dob].filter(Boolean).join(' · ') }] : []),
            ],
          }}
        >
          {!railIds.has('howtoplay') && howtoNode}
          {!railIds.has('gadget') && gadgetNode}
          {!railIds.has('loadout') && loadoutNode}
          {attachNode}
          {lore.biography || lore.ubiBio ? (
            <CxSection id="biography" title="Biography">
              {loreParas(lore.biography).map((para, i) => <p key={i}>{para}</p>)}
            </CxSection>
          ) : null}
          {lore.psychReport || lore.psychProfile ? (
            <CxSection id="psych" title="Psychological Report">
              {lore.psychProfile ? <p><em>{lore.psychProfile}</em></p> : null}
              {loreParas(lore.psychReport).map((para, i) => <p key={i}>{para}</p>)}
              <p className="text-sm" style={{ color: 'var(--muted)' }}>— Dr. Harishva "Harry" Pandey, Director of Rainbow</p>
            </CxSection>
          ) : null}
          {(lore.quotes || []).length ? (
            <CxSection id="quotes" title="Quotes">
              <ul>{lore.quotes.map((quote, i) => <li key={i}>“{quote}”</li>)}</ul>
            </CxSection>
          ) : null}
          {(lore.trivia || []).length ? (
            <CxSection id="trivia" title="Trivia">
              <ul>{lore.trivia.map((item, i) => <li key={i}>{item}</li>)}</ul>
            </CxSection>
          ) : null}
          <NotesEditor title="Operator Notes" value={note || ''} onChange={onNoteChange} placeholder="Strats, counters, setups..." />
        </ArticleShell>
      );
    };

    // Article sections: DBD-style display-serif subtitles, collapsible on
    // all tiers, open state persisted per view+section. TOC navigation
    // expands the target first (cx-expand-section event).
    const cxViewKey = () => {
      try {
        return new URLSearchParams(window.location.search).get('view') || 'home';
      } catch { return 'home'; }
    };
    const CxSection = ({ id, title, children, collapsible = true }) => {
      const [open, setOpen] = useState(true);
      useEffect(() => {
        // Re-key persisted state per view (same section id across article
        // types keeps its own preference).
        try {
          const saved = window.localStorage.getItem(`cx-sec:r6:${cxViewKey()}:${id}`);
          setOpen(saved === null ? true : saved === '1');
        } catch { /* private mode */ }
      }, [id]);
      useEffect(() => {
        const expand = (e) => { if (e && e.detail === id) setOpen(true); };
        window.addEventListener('cx-expand-section', expand);
        return () => window.removeEventListener('cx-expand-section', expand);
      }, [id]);
      const toggle = () => setOpen((prev) => {
        const next = !prev;
        try {
          window.localStorage.setItem(`cx-sec:r6:${cxViewKey()}:${id}`, next ? '1' : '0');
        } catch { /* private mode */ }
        return next;
      });
      if (!collapsible) {
        return (<section id={id} className="mt-6"><h2 className="cx-sec">{title}</h2><div className="cx-section-body">{children}</div></section>);
      }
      return (
        <section id={id} className="mt-6">
          <h2
            className="cx-sec cx-sec--toggle"
            role="button"
            tabIndex={0}
            aria-expanded={open}
            onClick={toggle}
            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } }}
          >
            <span className="cx-sec-title">{title}</span>
            <span className="cx-sec-ind" aria-hidden="true">{open ? '▾' : '▸'}</span>
          </h2>
          {open ? <div className="cx-section-body">{children}</div> : null}
        </section>
      );
    };

    const GadgetsView = ({ setView }) => {
      const [q, setQ] = useState('');
      const [side, setSide] = useState('all');
      const query = q.trim().toLowerCase();
      const matches = (op) => !query || (op.gadget + ' ' + op.name).toLowerCase().includes(query);
      const attackers = OPERATORS.filter((op) => op.side === 'Attacker' && matches(op));
      const defenders = OPERATORS.filter((op) => op.side === 'Defender' && matches(op));
      const secondaries = GADGETS.filter((g) => !query || (g.name + ' ' + (g.type || '')).toLowerCase().includes(query));
      const opByName = useMemo(() => {
        const map = new Map();
        OPERATORS.forEach((op) => {
          map.set(op.name, op);
          map.set(normOpName(op.name), op);
        });
        return map;
      }, []);
      const gadgetUsers = (g) => (g.users || []).map((name) => opByName.get(name) || opByName.get(normOpName(name))).filter(Boolean);
      const Group = ({ title, items }) => (
        <div className="mb-6">
          <h2 className="cx-h2">{title}</h2>
          <table className="cx-wikitable"><thead><tr><th></th><th>Gadget</th><th>Operator</th></tr></thead>
            <tbody>{items.map((op) => (
              <tr key={op.id}><td><span className="sq-img"><AssetFrame type="Gadget" imageUrl={op.gadgetIcon ? `./${op.gadgetIcon}` : null} /></span></td><td>{op.gadget}</td>
                <td><button type="button" className="cx-alink font-semibold" onClick={() => setView('operator', { id: op.id })}>{op.name}</button></td></tr>
            ))}</tbody></table>
        </div>
      );
      const SIDES = [{ id: 'all', label: 'All' }, { id: 'Attacker', label: 'Attack' }, { id: 'Defender', label: 'Defense' }, { id: 'global', label: 'Global' }];
      return (
        <div className="cx-article">
          <h1 className="cx-title">Gadgets</h1>
          <p className="cx-lead">Unique gadgets by operator, plus global secondaries.</p>
          <WikiHeaderSearchPortal>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter gadgets..." aria-label="Filter gadgets"
              className="w-full rounded-2xl px-4 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
          </WikiHeaderSearchPortal>
          <div className="flex flex-wrap gap-2 mt-4 mb-6" role="tablist" aria-label="Filter by side">
            {SIDES.map((s) => (
              <button key={s.id} type="button" role="tab" aria-selected={side === s.id} onClick={() => setSide(s.id)} className="cx-chip"
                style={side === s.id ? { borderColor: 'var(--accent)', color: 'var(--text)', fontWeight: 700 } : null}>{s.label}</button>
            ))}
          </div>
          {(side === 'all' || side === 'Attacker') && <Group title="Attacker gadgets" items={attackers} />}
          {(side === 'all' || side === 'Defender') && <Group title="Defender gadgets" items={defenders} />}
          {(side === 'all' || side === 'global') && (
          <div>
          <h2 className="cx-h2">Global gadgets</h2>
          <table className="cx-wikitable"><thead><tr><th></th><th>Gadget</th><th>Operators</th></tr></thead>
            <tbody>{secondaries.map((g) => {
              const users = gadgetUsers(g);
              return (
              <tr key={g.id}><td><span className="sq-img"><AssetFrame type="Gadget" imageUrl={g.image ? `./${g.image}` : null} /></span></td>
                <td><button type="button" className="cx-alink font-semibold" onClick={() => setView('gadget', { id: g.id })}>{g.name}</button></td>
                <td>{users.length ? users.map((op, i) => (
                  <span key={op.id}>{i > 0 ? ', ' : null}<button type="button" className="cx-alink" onClick={() => setView('operator', { id: op.id })}>{op.name}</button></span>
                )) : '—'}</td></tr>
              );
            })}</tbody></table>
          </div>
          )}
        </div>
      );
    };

    const WeaponsView = ({ setView }) => {
      const [q, setQ] = useState('');
      const [type, setType] = useState('all');
      const query = q.trim().toLowerCase();
      const types = useMemo(() => [...new Set(WEAPONS.map((w) => w.type).filter(Boolean))].sort(), []);
      const list = WEAPONS.filter((w) => (type === 'all' || w.type === type)
        && (!query || `${w.name} ${w.type || ''} ${(w.aliases || []).join(' ')}`.toLowerCase().includes(query)));
      return (
        <div className="cx-article">
          <h1 className="cx-title">Weapons</h1>
          <p className="cx-lead">{WEAPONS.length} firearms across every operator loadout.</p>

    const FLOOR_LABELS = { basement: 'Basement', 'floor-1': 'Floor 1', 'floor-2': 'Floor 2', 'floor-3': 'Floor 3', roof: 'Roof', spawn: 'Spawns', overview: 'Overview' };

    const MapFloorModal = ({ map, initialIndex, onClose, noteValue, onNoteChange }) => {
      const layouts = (map && map.layouts) || [];
      const [currentIndex, setCurrentIndex] = useState(initialIndex || 0);
      const [layoutBroken, setLayoutBroken] = useState(false);
      const [zoom, setZoom] = useState(1);
      useEffect(() => {
        setCurrentIndex(initialIndex || 0);
        setLayoutBroken(false);
        setZoom(1);
      }, [map && map.id, initialIndex]);
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') onClose();
          else if (e.key === 'ArrowRight') { setCurrentIndex((i) => Math.min(layouts.length - 1, i + 1)); setLayoutBroken(false); setZoom(1); }
          else if (e.key === 'ArrowLeft') { setCurrentIndex((i) => Math.max(0, i - 1)); setLayoutBroken(false); setZoom(1); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose, layouts.length]);
      if (!map) return null;
      const current = layouts[currentIndex];
      const currentFloor = current ? current.floor : null;
      const floorJumps = [];
      layouts.forEach((l, i) => {
        if (!floorJumps.some((f) => f.floor === l.floor)) floorJumps.push({ floor: l.floor, index: i });
      });
      const step = (dir) => {
        setCurrentIndex((i) => Math.max(0, Math.min(layouts.length - 1, i + dir)));
        setLayoutBroken(false);
        setZoom(1);
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(0,0,0,0.9)', backdropFilter: 'blur(4px)' }} onClick={onClose} role="dialog" aria-label={`${map.name} floor plans`}>

                <span className="block text-lg font-bold truncate" style={{ color: 'var(--text)', fontFamily: 'var(--font-display)' }}>{map.name}</span>

              {!current ? (
                <p style={{ color: 'var(--muted)' }}>No floor plans bundled yet.</p>

                <div>
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={() => step(-1)} disabled={currentIndex === 0} aria-label="Previous floor" className="p-2 rounded-full shrink-0" style={{ color: 'var(--muted)', opacity: currentIndex === 0 ? 0.3 : 1 }}>‹</button>
                    <div className="relative flex-1 min-w-0 overflow-hidden rounded-xl flex items-center justify-center" style={{ background: 'rgba(0,0,0,0.4)', maxHeight: '55vh' }}
                      onWheel={(e) => { if (e.ctrlKey || e.metaKey) return; setZoom((z) => Math.max(1, Math.min(3, z + (e.deltaY < 0 ? 0.25 : -0.25)))); }}>
                      {!layoutBroken ? (
                        <img src={`./${current.image}`} alt={`${map.name} — ${current.label}`} className="w-full" style={{ objectFit: 'contain', maxHeight: '55vh', transform: `scale(${zoom})`, transformOrigin: 'center', transition: 'transform 0.15s' }} onError={() => setLayoutBroken(true)} />
                      ) : (
                        <p className="p-8 text-sm" style={{ color: 'var(--muted)' }}>Layout image failed to load.</p>
                      )}
                    </div>
                    <button type="button" onClick={() => step(1)} disabled={currentIndex === layouts.length - 1} aria-label="Next floor" className="p-2 rounded-full shrink-0" style={{ color: 'var(--muted)', opacity: currentIndex === layouts.length - 1 ? 0.3 : 1 }}>›</button>

                    <div className="flex flex-wrap gap-1.5 flex-1">

                      <button type="button" onClick={() => setZoom(1)} aria-label="Reset zoom" className="px-2 py-1 rounded-lg text-xs font-bold" style={{ border: '1px solid var(--stroke)', color: 'var(--muted)' }}>{Math.round(zoom * 100)}%</button>
                      <button type="button" onClick={() => setZoom((z) => Math.min(3, z + 0.5))} aria-label="Zoom in" className="px-2 py-1 rounded-lg text-sm font-bold" style={{ border: '1px solid var(--stroke)', color: 'var(--muted)' }}>+</button>

                  </div>
                  <div className="mt-4">
                    <NotesEditor title="Map Notes" value={noteValue || ''} onChange={onNoteChange} placeholder="Setups, callouts, defaults..." />
                  </div>
                </div>

    const SeasonsView = ({ setView, favorites, onToggleFavorite }) => {
      const [q, setQ] = useState('');
      const query = q.trim().toLowerCase();
      const filtered = SEASONS.filter((s) => !query || (s.name + ' ' + s.code + ' ' + (s.operators || []).join(' ')).toLowerCase().includes(query));
      const byYear = (() => {
        const groups = {};
        filtered.forEach((s) => { (groups[s.year] = groups[s.year] || []).push(s); });
        return Object.keys(groups).map(Number).sort((a, b) => b - a).map((y) => ({ year: y, items: groups[y] }));
      })();
      return (
        <div className="cx-article">
          <h1 className="cx-title">Seasons</h1>
          <p className="cx-lead">{SEASONS.length} seasons from Year 1 to Year {Math.max(...SEASONS.map((s) => s.year))}.</p>
          <WikiHeaderSearchPortal>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Filter seasons..." aria-label="Filter seasons"
              className="w-full rounded-2xl px-4 py-2.5 text-sm" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)', color: 'var(--text)' }} />
          </WikiHeaderSearchPortal>
          {byYear.map((g) => (
            <div key={g.year} className="mb-6">
              <h2 className="cx-h2">Year {g.year}</h2>
              {g.items.map((s) => (
                <div key={s.id} className="w-full flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>

                  </button>
                  <FavButton active={(favorites.seasons || []).includes(s.id)} onToggle={() => onToggleFavorite('Season', s.id)} label={`Favorite ${s.name}`} />
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    };

    const SeasonArticle = ({ id, setView, note, onNoteChange }) => {
      const s = seasonsById.get(id);
      if (!s) return <div className="cx-article"><h1 className="cx-title">Not found</h1></div>;
      const seasonMap = MAPS.find((m) => m.name === s.map);
      const seasonPatches = patchesForSeason(s);
      return (
        <ArticleShell
          crumbs={[{ label: 'Main page', onClick: () => setView('home') }, { label: 'Seasons', onClick: () => setView('seasons') }, { label: s.name }]}
          title={s.name}
          lead={<p>{s.blurb}</p>}
          toc={[...((s.operators || []).length > 0 ? [{ id: 'operators', label: 'Operators' }] : []), ...(seasonPatches.length ? [{ id: 'patches', label: 'Patches' }] : [])]}
          categories={['Seasons', s.code]}
          infobox={{ title: s.code, sub: 'Season', image: s.cover ? `./${s.cover}` : (seasonMap && seasonMap.thumb ? `./${seasonMap.thumb}` : null), imageAlt: s.name, imageType: 'Map', rows: [{ label: 'Released', value: s.released || '—' }, ...(s.patch ? [{ label: 'Patch', value: s.patch }] : []), { label: 'Map', value: (s.maps && s.maps.length ? s.maps.join(', ') : (s.map || '—')) }, { label: 'Operators', value: (s.operators || []).join(', ') || '—' }] }}
        >
          {(s.operators || []).length > 0 ? (
            <CxSection id="operators" title="Operators">
              <div className="flex flex-wrap gap-2">
                {s.operators.map((name) => {
                  const op = OPERATORS.find((o) => o.name === name);

                      <span className="sq-img" style={{ width: '28px', height: '28px', display: 'inline-flex' }}><AssetFrame type="Operator" imageUrl={op.icon ? `./${op.icon}` : null} fallbackIcon={<OpAvatar name={op.name} side={op.side} size={28} />} /></span>{op.name}

              <table className="cx-wikitable"><thead><tr><th>Patch</th><th>Date</th><th>Highlights</th></tr></thead>

    const FavoritesView = ({ favorites, setView, onToggleFavorite }) => {

        <div className="cx-article">

                  <FavButton active onToggle={() => onToggleFavorite('Operator', op.id)} label={`Unfavorite ${op.name}`} />

                  <button type="button" onClick={() => setView('map', { id: m.id })} className="flex-1 text-left font-semibold" style={{ color: 'var(--text)' }}>{m.name}</button>
                  <FavButton active onToggle={() => onToggleFavorite('Map', m.id)} label={`Unfavorite ${m.name}`} />
                </div>
              ))}
              {favSeasons.map((s) => (
                <div key={s.id} className="flex items-center gap-3 rounded-2xl p-3 mb-2" style={{ background: 'var(--panel)', border: '1px solid var(--stroke)' }}>
                  <button type="button" onClick={() => setView('season', { id: s.id })} className="flex-1 text-left font-semibold" style={{ color: 'var(--text)' }}>{s.name}</button>
                  <FavButton active onToggle={() => onToggleFavorite('Season', s.id)} label={`Unfavorite ${s.name}`} />
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const SettingsView = ({ settings, setSettings, onBack }) => {
      const updateSetting = (field, value) => setSettings((prev) => ({ ...prev, [field]: value }));
      return (
      <div className="cx-article">
        <ViewCrumbs trail={[{ label: 'Main page', onClick: onBack }]} current="Settings" />
        <h1 className="cx-title">Settings</h1>
        <p className="cx-hatnote">Website preferences and backups.</p>
        <h2 className="cx-sec">Website info</h2>
        <table className="cx-wikitable"><tbody>
          <tr><th scope="row">Website Version</th><td><span className="font-semibold" style={{ color: 'var(--text)' }}>{META.siteVersion}</span></td></tr>
          <tr><th scope="row">Game Update / Data Updated</th><td><span className="font-semibold" style={{ color: 'var(--text)' }}>{META.gameVersion} / {META.lastSynced}</span></td></tr>
          <tr><th scope="row">Legal</th><td><SiteLegalFooter className="mt-3" /></td></tr>
        </tbody></table>
        <h2 className="cx-sec">Data sources</h2>
        <table className="cx-wikitable"><tbody>
          <tr><th scope="row">Rainbow Six Wiki</th><td>Operators, maps, seasons, weapons and lore (CC-BY-SA, no verbatim reuse beyond facts).</td></tr>
          <tr><th scope="row">Ubisoft</th><td>Canonical bios, loadouts, gameplay tips and renders used to verify data per season.</td></tr>
        </tbody></table>
        <h2 className="cx-sec">Appearance</h2>
        <table className="cx-wikitable"><tbody>
          <tr><th scope="row">Color</th><td>
            <div className="grid grid-cols-3 gap-1.5">
              {[
                { id: 'dark', label: 'Dark' },
                { id: 'oled', label: 'Black' },
                { id: 'light', label: 'Light' }
              ].map((mode) => {
                const isActive = (settings.colorMode || 'oled') === mode.id;
                return (
                  <button
                    key={mode.id}
                    type="button"
                    onClick={() => updateSetting('colorMode', mode.id)}
                    className={`mode-choice ${isActive ? 'mode-choice--active' : ''} rounded-xl px-2 py-2 text-xs font-bold transition-colors`}
                    aria-pressed={isActive}
                  >
                    {mode.label}
                  </button>
                );
              })}
            </div>
          </td></tr>
          <tr><th scope="row">Text size</th><td>
            <select value={settings.fontSize} onChange={e => updateSetting('fontSize', e.target.value)} className="themed-select w-full text-sm">
              <option value="small">Small</option>
              <option value="default">Standard</option>
              <option value="large">Large</option>
            </select>
          </td></tr>
        </tbody></table>
        <h2 className="cx-sec">Features</h2>
        <table className="cx-wikitable"><tbody>
          <tr><th scope="row">Haptics</th><td>
            <button type="button" onClick={() => updateSetting('hapticEnabled', !(settings.hapticEnabled !== false))} className="cx-toolbtn" aria-pressed={settings.hapticEnabled !== false}>
              {settings.hapticEnabled !== false ? 'On' : 'Off'}
            </button> <span className="text-sm" style={{ color: 'var(--muted)' }}>Vibration on taps (mobile).</span>
          </td></tr>
          <tr><th scope="row">Favorites</th><td>
            <button type="button" onClick={() => { try { saveToStorage(R6_STORAGE_KEYS.favorites, { favoriteOperators: [], favoriteMaps: [], favoriteSeasons: [] }); } catch (e) { } window.location.reload(); }} className="cx-toolbtn cx-toolbtn--quiet">Clear all favorites</button>
          </td></tr>
        </tbody></table>
        <h2 className="cx-sec">Backup</h2>
        <table className="cx-wikitable"><tbody>
          <tr><th scope="row">Export</th><td>
            <p className="text-sm mb-2" style={{ color: 'var(--muted)' }}>Settings, favorites and notes as JSON.</p>
            <button type="button" onClick={() => {
              try {
                const payload = { app: 'r6-wiki', version: 1, exportedAt: new Date().toISOString(), settings, favorites: loadFromStorage(R6_STORAGE_KEYS.favorites, {}), notes: loadFromStorage(R6_STORAGE_KEYS.notes, {}) };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'r6-wiki-backup.json';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
              } catch (e) { }
            }} className="cx-toolbtn">Download backup</button>
          </td></tr>
          <tr><th scope="row">Restore</th><td>
            <label className="cx-toolbtn cx-toolbtn--quiet" style={{ cursor: 'pointer' }}>Restore backup
              <input type="file" accept="application/json" hidden onChange={(e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  try {
                    const payload = JSON.parse(reader.result);
                    if (payload.app !== 'r6-wiki') throw new Error('bad backup');
                    if (payload.settings) setSettings((p) => ({ ...p, ...payload.settings }));
                    if (payload.favorites) saveToStorage(R6_STORAGE_KEYS.favorites, payload.favorites);
                    if (payload.notes) saveToStorage(R6_STORAGE_KEYS.notes, payload.notes);
                    window.location.reload();
                  } catch (err) { }
                };
                reader.readAsText(file);
                e.target.value = '';
              }} />
            </label>
          </td></tr>
          <tr><th scope="row">Reset</th><td>
            <button type="button" onClick={() => { try { Object.keys(localStorage).filter((k) => k.startsWith('r6_')).forEach((k) => localStorage.removeItem(k)); } catch (e) { } window.location.reload(); }} className="cx-toolbtn" style={{ background: 'rgba(225,29,72,0.15)', borderColor: 'rgba(225,29,72,0.4)', color: '#fda4af' }}>Clear saved data &amp; reload</button>
          </td></tr>
        </tbody></table>
      </div>
      );
    };
    /* ------------------------------- shell -------------------------------- */

    const WikiHeader = ({ currentView, setView }) => {
      useEffect(() => {
        const onKey = (e) => {
          if (e.key !== '/') return;
          const tgt = e.target;
          if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable)) return;
          const slot = document.getElementById('wiki-header-search-slot');
          const input = slot && slot.querySelector('input');
          if (input) {
            e.preventDefault();
            input.focus();
            input.select();
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      const hasSearch = !['home'].includes(currentView);
      return (
        <header className="wiki-header sticky top-0 z-30 flex items-center justify-between gap-4 px-4">
          <button type="button" onClick={() => setView('home')} className="flex items-center gap-3 shrink-0" aria-label="Main page">
            <img src="./assets/wiki-logo.png" alt="R6 Wiki" width={110} height={46} className="wiki-logo-img" style={{ objectFit: 'contain' }} />
          </button>
          <div
            id="wiki-header-search-slot"
            className="absolute flex items-center"
            style={{
              left: '50%',
              transform: 'translateX(-50%)',
              width: hasSearch ? '470px' : '0px',
              opacity: hasSearch ? 1 : 0,
              pointerEvents: hasSearch ? 'auto' : 'none',
              overflow: hasSearch ? 'visible' : 'hidden'
            }}
          />
          <button
            type="button"
            onClick={() => setView('settings')}
            className="shrink-0 w-9 h-9 border border-white/10 text-zinc-400 hover:text-white hover:bg-white/10 transition-colors flex items-center justify-center"
            aria-label="Settings"
          >
            <Icons.Gear width={16} height={16} />
          </button>
        </header>
      );
    };
    const SiteFooter = ({ currentView }) => {
      useEffect(() => {
        if (typeof window === 'undefined') return undefined;
        if (!window.matchMedia('(min-width: 768px)').matches) return undefined;
        const timer = window.setTimeout(() => {
          const root = document.querySelector('[data-smoke-view]');
          if (!root) return;
          const div = document.createElement('div');
          div.className = 'site-footer';
          div.innerHTML = `
            <div class="site-footer-legal">
              <a href="./privacy-policy">Privacy Policy</a>
              <a href="./privacy-policy#disclaimer">Legal &amp; Disclaimer</a>
              <span>Operator data &copy; Rainbow Six Wiki contributors (CC-BY-SA)</span>
            </div>`;
          const article = root.querySelector('.cx-article');
          if (article) {
            article.appendChild(div);
            return;
          }
          const candidates = [root, ...Array.from(root.querySelectorAll('.overflow-y-auto'))]
            .filter((el) => el.classList.contains('overflow-y-auto'));
          const scroller = candidates.sort((a, b) => b.scrollHeight - a.scrollHeight)[0];
          if (!scroller || scroller.scrollHeight <= scroller.clientHeight + 50) return;
          scroller.appendChild(div);
          return;
        }, 60);
        return () => {
          document.querySelectorAll('.site-footer').forEach((el) => el.remove());
          window.clearTimeout(timer);
        };
      }, [currentView]);
      return null;
    };
    const WebsiteHeader = ({ currentView, setView, titleOverride, onOpenDrawer }) => {
      const headerTitle = currentView === 'home' ? 'Search' : (titleOverride || getNavDisplayLabel(currentView));
      return (
        <header className="website-topbar shrink-0 px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
          <div className="flex items-center gap-1 min-w-0">
          {onOpenDrawer && (
            <button type="button" onClick={onOpenDrawer} className="cx-hamb" aria-label="Open navigation">
              <span aria-hidden="true" /><span aria-hidden="true" /><span aria-hidden="true" />
            </button>

          <button onClick={() => setView('home')} className="group flex items-center gap-3 min-w-0 text-left" aria-label="Open search">
            <div className="website-brand-mark w-9 h-9 shrink-0 flex items-center justify-center border border-white/15">
              <img src="./assets/wiki-logo.png" alt="" width={30} height={30} style={{ objectFit: 'contain' }} />
            </div>

              <h1 className="text-lg text-[var(--text)] truncate" style={{ fontFamily: 'var(--font-display)', fontWeight: 600, letterSpacing: '0.01em' }}>{headerTitle}</h1>
            </div>
          </button>
          </div>
          <div className="hidden md:flex items-center gap-5">
            <span style={{ fontFamily: 'var(--mono-fallback, ui-monospace, monospace)', fontSize: '10px', letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--faint, var(--muted))' }}>
              {META.gameVersion} · synced {META.lastSynced}
            </span>
          </div>
          <button
            onClick={() => setView('settings')}
            className="shrink-0 w-10 h-10 border border-white/10 bg-white/[0.035] text-zinc-400 hover:text-white hover:bg-white/10 transition-colors flex items-center justify-center"
            aria-label="Open settings"
          >
            <Icons.Gear width={18} height={18} />
          </button>
